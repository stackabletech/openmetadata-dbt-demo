---
# Credentials the OPA User Info Fetcher uses to read user/group metadata from
# Keycloak. Must contain `clientId` and `clientSecret`. These correspond to the
# confidential `user-info-fetcher` client created by the configure-keycloak job
# (infrastructure/keycloak-manifests/configure-keycloak.yaml), whose service
# account is granted the realm-management `view-users` role.
apiVersion: v1
kind: Secret
metadata:
  name: user-info-fetcher-client-credentials
  namespace: platform
type: Opaque
stringData:
  clientId: user-info-fetcher
  clientSecret: user-info-fetcher-secret
