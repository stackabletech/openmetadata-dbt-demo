---
# Secrets consumed by the Cockpit Helm chart (via secretKeyRef).
#   session-secret     — signs Cockpit session cookies (any long random string).
#   oidc-client-secret — must match the `cockpit` Keycloak client secret
#                        (infrastructure/keycloak-manifests/configure-keycloak.yaml).
#   trino-auth-password — password of the `cockpit` static Trino user
#                        (secrets/manifests/trino/trino-users.yaml).
#   database-password  — PostgreSQL user `cockpit` (postgresql-cockpit in `shared`; the
#                        postgres ApplicationSet sets password = component name).
#   storage-encryption-key — encrypts the storage connections users save in Cockpit (S3
#                        credentials); 64 hex characters. Changing it makes them unreadable.
apiVersion: v1
kind: Secret
metadata:
  name: cockpit-secrets
  namespace: platform
type: Opaque
stringData:
  session-secret: "data2day-cockpit-session-signing-secret-change-me"
  oidc-client-secret: "cockpit-secret"
  trino-auth-password: "cockpitcockpit"
  database-password: cockpit
  storage-encryption-key: 33fb2243937ae9bffb32251191da8ea62e59f51c79d32f3ff52a5fc362beae6f
