---
apiVersion: v1
kind: Secret
metadata:
  name: trino-users
  namespace: platform
type: Opaque
stringData:
  admin: adminadmin
  # Service account used by Stackable Cockpit to connect to Trino; it impersonates
  # the logged-in end user (allowed by the `impersonation` rule in the OPA policy).
  cockpit: cockpitcockpit
  # Service account for Superset; it impersonates the logged-in user (`impersonation` rule
  # in the OPA policy), so Trino applies the policies per user.
  superset: GGxsox0XCGiNrIHh0qE7K_-9WFCRX5io
