---
# OAuth2 client credentials of the Keycloak client `lakekeeper-service`
# (infrastructure/keycloak-manifests/configure-keycloak.yaml). Used by the Trino
# catalog `data2day` (Iceberg REST, key `credential` = "<id>:<secret>") and by the
# lakekeeper-init Job (client-id / client-secret).
apiVersion: v1
kind: Secret
metadata:
  name: lakekeeper-service-credentials
  namespace: platform
type: Opaque
stringData:
  client-id: lakekeeper-service
  client-secret: lakekeeper-service-secret
  credential: lakekeeper-service:lakekeeper-service-secret
