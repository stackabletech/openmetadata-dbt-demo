---
# Grafana dashboards for Trino queries (logs-trino-queries-*, from Trino's HTTP event listener via the
# vector-aggregator):
#   - "Trino queries": the list of completed queries with user, tables and what OPA did to them
#     (access: allowed / masked / row filter / denied); clicking a row opens
#   - "Trino query detail": one query (var-query_id + its time window from the link) with all fields,
#     its OPA decisions (logs-opa-decisions-*), the Trino and OPA log, and a link to the Trino web UI
#     (NodePort 30443).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-trino-queries
  namespace: platform
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Governance
data:
  trino-queries.json: |
    {
      "schemaVersion": 39,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "editable": true,
      "uid": "trino-queries",
      "title": "Trino queries",
      "tags": [
        "trino",
        "opa",
        "governance"
      ],
      "description": "Completed Trino queries (HTTP event listener -> logs-trino-queries-*). Click a query for its details on 'Trino query detail'.",
      "templating": {
        "list": [
          {
            "name": "user",
            "label": "User",
            "type": "query",
            "datasource": {
              "type": "grafana-opensearch-datasource",
              "uid": "opensearch-trino-queries"
            },
            "query": "{\"find\": \"terms\", \"field\": \"user.keyword\"}",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "access",
            "label": "Access",
            "type": "custom",
            "query": "allowed,masked,row filter,denied",
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "description": "What OPA did to the query: allowed, masked (column masks), row filter, denied"
          },
          {
            "name": "state",
            "label": "State",
            "type": "custom",
            "query": "FINISHED,FAILED",
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          }
        ]
      },
      "links": [
        {
          "title": "Trino query detail",
          "type": "link",
          "url": "/d/trino-query-detail/trino-query-detail",
          "keepTime": true,
          "icon": "dashboard"
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "Queries",
          "description": "Completed Trino queries, newest first. Click a row for the query's details, OPA decisions and logs; 'Trino UI' opens the query in the Trino web UI. Access is what OPA did to the query. Technical users (admin, cockpit) are left out.",
          "datasource": {
            "type": "grafana-opensearch-datasource",
            "uid": "opensearch-trino-queries"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 26
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-opensearch-datasource",
                "uid": "opensearch-trino-queries"
              },
              "queryType": "lucene",
              "query": "user.keyword:${user:lucene} AND state.keyword:${state:lucene} AND access:${access:lucene} AND NOT user.keyword:(admin OR cockpit)",
              "timeField": "timestamp",
              "metrics": [
                {
                  "id": "1",
                  "type": "raw_data",
                  "settings": {
                    "size": "500"
                  }
                }
              ],
              "bucketAggs": []
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "includeByName": {
                  "timestamp": true,
                  "user": true,
                  "access": true,
                  "tables": true,
                  "masked_columns": true,
                  "sql": true,
                  "state": true,
                  "error_code": true,
                  "wall_s": true,
                  "output_rows": true,
                  "trino_ui_url": true,
                  "query_id": true,
                  "window_from_ms": true,
                  "window_to_ms": true
                },
                "indexByName": {
                  "timestamp": 0,
                  "user": 1,
                  "access": 2,
                  "tables": 3,
                  "masked_columns": 4,
                  "sql": 5,
                  "state": 6,
                  "error_code": 7,
                  "wall_s": 8,
                  "output_rows": 9,
                  "trino_ui_url": 10,
                  "query_id": 11,
                  "window_from_ms": 12,
                  "window_to_ms": 13
                },
                "renameByName": {
                  "timestamp": "Time",
                  "user": "User",
                  "access": "Access",
                  "state": "State",
                  "error_code": "Error",
                  "tables": "Tables",
                  "masked_columns": "Masked columns",
                  "row_filters": "Row filters",
                  "wall_s": "Wall time",
                  "output_rows": "Rows",
                  "sql": "SQL",
                  "query_id": "Query ID",
                  "trino_ui_url": "Trino UI"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": true
              },
              "links": [
                {
                  "title": "Query details, OPA decisions and logs",
                  "url": "/d/trino-query-detail/trino-query-detail?var-query_id=${__data.fields.query_id}&from=${__data.fields.window_from_ms}&to=${__data.fields.window_to_ms}",
                  "targetBlank": false
                }
              ],
              "mappings": [
                {
                  "type": "regex",
                  "options": {
                    "pattern": "^\\[\\s*\\]$",
                    "result": {
                      "text": " "
                    }
                  }
                }
              ]
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Trino UI"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open in the Trino web UI",
                        "url": "${__value.raw}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Trino UI"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "^https.*",
                          "result": {
                            "text": "open \u2197"
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Wall time"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Time"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "window_from_ms"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "window_to_ms"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Access"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "allowed": {
                            "color": "green",
                            "index": 0
                          },
                          "masked": {
                            "color": "orange",
                            "index": 1
                          },
                          "row filter": {
                            "color": "orange",
                            "index": 2
                          },
                          "masked + row filter": {
                            "color": "orange",
                            "index": 3
                          },
                          "denied": {
                            "color": "red",
                            "index": 4
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 150
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "User"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 130
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "State"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 100
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Time"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 190
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Wall time"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 90
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Rows"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 70
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Trino UI"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 80
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Error"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 170
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Tables"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 260
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Masked columns"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 300
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Query ID"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Time",
                "desc": true
              }
            ]
          }
        }
      ]
    }
