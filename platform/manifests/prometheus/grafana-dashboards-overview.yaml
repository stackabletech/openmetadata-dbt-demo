---
# Grafana dashboard "Stackable Data Platform": the entry point across all products and Grafana's home
# dashboard (grafana.ini dashboards.default_home_dashboard_path in platform/applications/prometheus.yaml).
#   - product tiles: status from Prometheus (share of scrape targets up); click -> the product's governance
#     dashboard (Trino queries, Airflow authorization, OPA decisions) or its metrics dashboard
#   - authorization across products from the OPA decision log (logs-opa-decisions-*), per product
#   - recent denials; each row drills down via the decision's `drilldown` field (set by the
#     vector-aggregator, transform opa_decisions). A new product: tile here + branch there.
# Generated together with the headers of the governance dashboards (logo: grafana-branding.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-overview
  namespace: platform
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Stackable Data Platform
data:
  sdp-overview.json: |
    {
      "uid": "sdp-overview",
      "title": "Stackable Data Platform",
      "tags": [
        "stackable",
        "overview",
        "governance"
      ],
      "description": "Entry point across all products: status (Prometheus), authorization decisions (OPA, OpenSearch) and drill-down into the product dashboards.",
      "editable": true,
      "schemaVersion": 39,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 900,
          "type": "text",
          "title": "",
          "transparent": true,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 3
          },
          "options": {
            "mode": "html",
            "content": "<div style=\"display:flex;align-items:center;gap:14px;height:100%\"><a href=\"/d/sdp-overview\"><img src=\"/public/img/stackable/stackable-icon.svg\" alt=\"Stackable\" style=\"height:40px\"></a><div><div style=\"font-size:20px;font-weight:600;line-height:1.2\">Stackable Data Platform</div><div style=\"opacity:0.7;font-size:13px\">All products: status, authorization and drill-down</div></div><div style=\"margin-left:auto;font-size:13px;display:flex;gap:16px\"><a href=\"/d/sdp-overview\" style=\"font-weight:600;text-decoration:underline\">Overview</a><a href=\"/d/trino-queries\" style=\"opacity:0.85\">Trino queries</a><a href=\"/d/airflow-authorization\" style=\"opacity:0.85\">Airflow authorization</a><a href=\"/d/opa-decisions\" style=\"opacity:0.85\">OPA decisions</a><a href=\"/d/stackable-logs\" style=\"opacity:0.85\">Logs</a></div></div>"
          }
        },
        {
          "id": 1,
          "type": "row",
          "title": "Products",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 24,
            "h": 1
          },
          "panels": []
