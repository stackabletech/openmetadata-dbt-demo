          "id": 10,
          "type": "stat",
          "title": "Trino",
          "description": "Trino. Status: share of its Prometheus scrape targets that are up. Click: governance dashboard. Metrics dashboard: link in the panel header.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 4,
            "h": 4
          },
          "links": [
            {
              "title": "Governance dashboard",
              "url": "/d/trino-queries?${__url_time_range}"
            },
            {
              "title": "Metrics dashboard",
              "url": "/d/-mVc4yO4k?${__url_time_range}"
            }
          ],
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false,
              "expr": "sum(up{namespace=\"platform\",app_kubernetes_io_name=\"trino\"}) / count(up{namespace=\"platform\",app_kubernetes_io_name=\"trino\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 1,
                    "to": 1,
                    "result": {
                      "text": "Up",
                      "color": "green",
                      "index": 0
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 0.0001,
                    "to": 0.9999,
                    "result": {
                      "text": "Degraded",
                      "color": "orange",
                      "index": 1
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Down",
                      "color": "red",
                      "index": 2
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No metrics",
                      "color": "#5a5a5a",
                      "index": 3
                    }
                  }
                }
              ],
              "color": {
                "mode": "fixed",
                "fixedColor": "#5a5a5a"
              },
              "noValue": "No metrics",
              "links": [
                {
                  "title": "Trino: governance",
