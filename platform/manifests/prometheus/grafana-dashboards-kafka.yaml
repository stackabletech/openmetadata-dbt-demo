        {
          "id": 27,
          "type": "state-timeline",
          "title": "Quorum role",
          "description": "This process's role in the KRaft quorum over time.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 48,
            "w": 12,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(max by (state) (kafka_server_raft_metrics_current_state{namespace=~\"$namespace\",app_kubernetes_io_instance=~\"$cluster\",pod=\"$broker\"} == 1) * on (state) group_left() (label_replace(vector(1), \"state\", \"leader\", \"\", \"\") or label_replace(vector(2), \"state\", \"follower\", \"\", \"\") or label_replace(vector(3), \"state\", \"observer\", \"\", \"\") or label_replace(vector(4), \"state\", \"candidate\", \"\", \"\") or label_replace(vector(5), \"state\", \"voted\", \"\", \"\") or label_replace(vector(6), \"state\", \"unattached\", \"\", \"\")))",
              "range": true,
              "instant": false,
              "legendFormat": "role"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "leader",
                      "color": "purple",
                      "index": 0
                    },
                    "2": {
                      "text": "follower",
                      "color": "blue",
                      "index": 1
