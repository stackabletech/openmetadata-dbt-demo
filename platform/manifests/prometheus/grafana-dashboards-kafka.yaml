---
# Grafana dashboards "Kafka topic" and "Kafka broker": drill-down from the topic and broker lists on the
# "Kafka" dashboard (grafana-dashboards-stackable.yaml). Prometheus only (the brokers' and controllers'
# JMX metrics); Kafka has no per-consumer-group metrics there. Generated by scripts/grafana-dashboards.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-kafka
  namespace: platform
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Stackable Data Platform
data:
  kafka-topic.json: |
    {
      "uid": "kafka-topic",
      "title": "Kafka topic",
      "tags": [
        "kafka"
      ],
      "editable": true,
      "schemaVersion": 41,
      "description": "One Kafka topic: partitions with watermarks, throughput, consumers. Opened from 'Kafka'.",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "current": {
              "text": "default",
              "value": "default"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(kafka_server_kafkaserver_brokerstate, namespace)",
            "includeAll": false,
            "label": "Namespace",
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(kafka_server_kafkaserver_brokerstate, namespace)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query",
            "hide": 2
          },
          {
            "current": {
              "text": "simple-kafka",
              "value": "simple-kafka"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(kafka_server_kafkaserver_brokerstate{namespace=~\"$namespace\"},app_kubernetes_io_instance)",
            "includeAll": false,
            "label": "Cluster",
            "name": "cluster",
            "options": [],
            "query": {
              "qryType": 1,
              "query": "label_values(kafka_server_kafkaserver_brokerstate{namespace=~\"$namespace\"},app_kubernetes_io_instance)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query",
            "hide": 2
          },
          {
            "name": "topic",
            "label": "Topic",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "refresh": 2,
            "sort": 1,
            "query": {
              "query": "label_values(kafka_log_log_logendoffset{namespace=~\"$namespace\",app_kubernetes_io_instance=~\"$cluster\",app_kubernetes_io_component=\"broker\",topic!~\"__.*\"}, topic)",
              "refId": "topic"
            },
            "definition": "label_values(kafka_log_log_logendoffset{namespace=~\"$namespace\",app_kubernetes_io_instance=~\"$cluster\",app_kubernetes_io_component=\"broker\",topic!~\"__.*\"}, topic)",
            "current": {},
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "links": [
        {
          "title": "Kafka",
          "type": "link",
          "url": "/d/C_8qIX04k",
          "icon": "arrow-left",
          "keepTime": true
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Partitions",
          "description": "Partitions of the topic.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(max by (topic, partition) (kafka_log_log_logendoffset{namespace=~\"$namespace\",app_kubernetes_io_instance=~\"$cluster\",app_kubernetes_io_component=\"broker\",topic=\"$topic\"}))",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "mappings": [],
              "noValue": "-"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "wideLayout": true
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Retained messages",
          "description": "Messages currently stored: high minus low watermark, summed over the partitions.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 3,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(max by (topic, partition) (kafka_log_log_logendoffset{namespace=~\"$namespace\",app_kubernetes_io_instance=~\"$cluster\",app_kubernetes_io_component=\"broker\",topic=\"$topic\"}) - max by (topic, partition) (kafka_log_log_logstartoffset{namespace=~\"$namespace\",app_kubernetes_io_instance=~\"$cluster\",app_kubernetes_io_component=\"broker\",topic=\"$topic\"}))",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "mappings": [],
              "noValue": "-"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "wideLayout": true
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Size",
          "description": "Bytes on disk (one replica).",
