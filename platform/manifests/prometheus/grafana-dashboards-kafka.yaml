              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              },
              "mappings": [],
              "noValue": "-"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "wideLayout": true
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Segments",
