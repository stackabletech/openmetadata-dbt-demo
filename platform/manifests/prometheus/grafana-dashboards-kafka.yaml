          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(max by (topic, partition) (kafka_log_log_numlogsegments{namespace=~\"$namespace\",app_kubernetes_io_instance=~\"$cluster\",app_kubernetes_io_component=\"broker\",topic=\"$topic\"}))",
              "range": true,
              "instant": false
