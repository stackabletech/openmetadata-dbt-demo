---
# Grafana dashboards "NiFi process group" and "NiFi processor": drill-down from the process group list on
# the "NiFi" dashboard (grafana-dashboards-stackable.yaml). Prometheus only (NiFi's flow metrics: totals
# over NiFi's rolling 5-minute window, shown per second). Generated by scripts/grafana-dashboards.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-nifi-flow
  namespace: platform
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Stackable Data Platform
data:
  nifi-process-group.json: |
    {
      "uid": "nifi-process-group",
      "title": "NiFi process group",
      "tags": [
        "nifi"
      ],
      "editable": true,
      "schemaVersion": 41,
      "description": "One NiFi process group: processors, connections (queues, back pressure), child groups. Opened from 'NiFi'.",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "current": {
              "text": "default",
              "value": "default"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(nifi_amount_bytes_read,namespace)",
            "includeAll": false,
            "label": "Namespace",
            "name": "namespace",
            "options": [],
            "query": {
              "qryType": 1,
              "query": "label_values(nifi_amount_bytes_read,namespace)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query",
            "hide": 2
          },
          {
            "current": {
              "text": "nifi",
              "value": "nifi"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(nifi_amount_bytes_read{namespace=~\"$namespace\"},app_kubernetes_io_instance)",
            "includeAll": false,
            "label": "Cluster",
            "name": "cluster",
            "options": [],
            "query": {
              "qryType": 1,
              "query": "label_values(nifi_amount_bytes_read{namespace=~\"$namespace\"},app_kubernetes_io_instance)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query",
            "hide": 2
          },
          {
            "name": "pg",
            "label": "Process group",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "refresh": 2,
            "sort": 1,
            "query": {
              "query": "query_result(max by (component_id, component_name) (nifi_amount_items_queued{namespace=~\"$namespace\",app_kubernetes_io_instance=~\"$cluster\",component_type=~\"ProcessGroup|RootProcessGroup\"}))",
              "refId": "pg"
            },
            "definition": "query_result(max by (component_id, component_name) (nifi_amount_items_queued{namespace=~\"$namespace\",app_kubernetes_io_instance=~\"$cluster\",component_type=~\"ProcessGroup|RootProcessGroup\"}))",
            "regex": "/component_id=\"(?<value>[^\"]+)\",component_name=\"(?<text>[^\"]+)\"/",
            "current": {},
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "links": [
        {
          "title": "NiFi",
          "type": "link",
          "url": "/d/C_8qIX04l",
          "icon": "arrow-left",
