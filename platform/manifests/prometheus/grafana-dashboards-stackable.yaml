---
# Grafana dashboards for the Stackable products, from Stackable's monitoring stack
# (github.com/stackabletech/demos, stacks/monitoring/grafana-dashboards.yaml, commit 45ad661,
# Apache-2.0); only the products deployed here. Loaded by Grafana's dashboard sidecar.
# The Kafka dashboard's topic and broker lists (panel ids 100-103, drill-down to grafana-dashboards-kafka.yaml)
# are added by scripts/grafana-dashboards.py; edit them there. Same for the NiFi dashboard's process group list
# (drill-down to grafana-dashboards-nifi-flow.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-stackable
  namespace: platform
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Stackable Data Platform
data:
