---
# OpenMetadata setup for the solar demo (configure_openmetadata.py): services for Kafka, NiFi,
# Airflow and Superset, so lineage runs from the NiFi flow to the Superset dashboards.
# Bump the Job name to re-run it after changing the script.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - job.yaml

configMapGenerator:
  - name: configure-solar-metadata-script
    namespace: platform
    files:
      - configure_openmetadata.py

generatorOptions:
  disableNameSuffixHash: true
