---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: configure-solar-metadata
  namespace: platform
---
# Create or update the Secret solar-openlineage-token (it is not in Git: it holds a bot JWT).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configure-solar-metadata
  namespace: platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["solar-openlineage-token"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configure-solar-metadata
  namespace: platform
subjects:
  - kind: ServiceAccount
    name: configure-solar-metadata
    namespace: platform
roleRef:
  kind: Role
  name: configure-solar-metadata
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-solar-metadata-v1
  namespace: platform
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: configure-solar-metadata
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: python:3.12-slim # renovate: datasource=docker depName=python
          command: ["python", "-u", "/scripts/configure_openmetadata.py"]
          env:
            - name: OM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-demo-passwords, key: demo_admin_password }
            - name: SUPERSET_USER
              valueFrom:
                secretKeyRef: { name: simple-superset-credentials, key: adminUser.username }
            - name: SUPERSET_PASSWORD
              valueFrom:
                secretKeyRef: { name: simple-superset-credentials, key: adminUser.password }
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: configure-solar-metadata-script
