---
# Patch to configure Trino endpoint and authentication.
# Uncomment the patches reference in kustomization.yaml to activate.
apiVersion: batch/v1
kind: Job
metadata:
  name: trino-sql-job
  # No namespace here: this is a strategic-merge patch and must match the base
  # Job (templates/trino-sql-job, which sets no namespace) at patch time, before
  # Kustomize's namespace transform runs. ArgoCD applies the result to the app's
  # destination namespace (platform). Declaring namespace here makes the patch
  # target 'trino-sql-job.platform', which matches nothing -> kustomize build fails.
spec:
  template:
    spec:
      containers:
        - name: trino-sql
          env:
            - name: TRINO_HOST
              value: "trino-coordinator"
            - name: TRINO_PORT
              value: "8443"
          volumeMounts:
            - name: credentials
              mountPath: /credentials
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: my-trino-credentials