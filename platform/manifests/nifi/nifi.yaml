---
apiVersion: nifi.stackable.tech/v1alpha1
kind: NifiCluster
metadata:
  name: nifi
  namespace: platform
spec:
  image:
    productVersion: 2.7.2
  clusterConfig:
    authentication:
      - authenticationClass: nifi-keycloak
        oidc:
          clientCredentialsSecret: nifi-keycloak-client
    # Authorization by OPA: package `nifi` (platform/manifests/opa/rego-nifi-policies.yaml), Keycloak
    # groups via the User Info Fetcher, team process groups created by configure-nifi.yaml
    authorization:
      opa:
        configMapName: opa
        package: nifi
        cache:
          # Short, so group and policy changes show up quickly in the demo
          entryTimeToLive: 10s
    sensitiveProperties:
      keySecret: nifi-sensitive-property-key
      autoGenerate: true
    vectorAggregatorConfigMapName: vector-aggregator-discovery
  nodes:
    roleConfig:
      listenerClass: external-unstable
    config:
      logging:
        enableVectorAgent: true
    roleGroups:
      default:
        replicas: 1
    # When NiFi is exposed through a NodePort Service it's SNI check has to be disabled
    configOverrides:
      nifi.properties:
        nifi.web.https.sni.required: "false"
        nifi.web.https.sni.host.check: "false"
