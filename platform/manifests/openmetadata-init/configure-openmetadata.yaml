---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openmetadata-init-script
  namespace: platform
data:
  configure.py: |
    #!/usr/bin/env python3
    """Configure OpenMetadata: register Trino as a database service and create ingestion pipelines."""

    import json
    import os
    import sys
    import time
    import urllib.request
    import urllib.error
    import urllib.parse

    OM_HOST = os.environ.get("OM_HOST", "http://openmetadata:8585")
    API = f"{OM_HOST}/api/v1"

    # OM runs in custom-oidc mode, so basic /users/login is forbidden (403).
    # We obtain a bearer token from Keycloak instead: a password grant for the
    # demo admin through the 'openmetadata' client yields a token with
    # aud=openmetadata that OM accepts and maps to the initial admin.
    KEYCLOAK_TOKEN_URL = os.environ.get(
        "KEYCLOAK_TOKEN_URL",
        "http://keycloak-service.platform.svc.cluster.local:8080/realms/stackable-demo/protocol/openid-connect/token",
    )
    OIDC_CLIENT_ID = os.environ.get("OM_OIDC_CLIENT_ID", "openmetadata")
    OIDC_CLIENT_SECRET = os.environ.get("OM_OIDC_CLIENT_SECRET", "openmetadata-secret")
    OM_ADMIN_USER = os.environ.get("OM_ADMIN_USER", "demo-admin")
    OM_ADMIN_PASSWORD = os.environ.get("OM_ADMIN_PASSWORD", "")

    TRINO_HOST = os.environ.get("TRINO_HOST", "trino-coordinator")
    TRINO_PORT = os.environ.get("TRINO_PORT", "8443")
    TRINO_SCHEME = os.environ.get("TRINO_SCHEME", "https")
    TRINO_USER = os.environ.get("TRINO_USER", "admin")
    # Trino requires auth; the OM ingestion must present the password or its
    # CheckAccess fails with 401. Sourced from the trino-users Secret.
    TRINO_PASSWORD = os.environ.get("TRINO_PASSWORD", "")

    MAX_RETRIES = int(os.environ.get("MAX_RETRIES", "60"))
    RETRY_INTERVAL = int(os.environ.get("RETRY_INTERVAL", "10"))

    SERVICE_NAME = "trino"
    PIPELINE_NAME = f"{SERVICE_NAME}_metadata_ingestion"


    def api_request(path, method="GET", data=None, token=None):
        """Make an API request to OpenMetadata."""
        url = f"{API}{path}"
        headers = {"Content-Type": "application/json"}
        if token:
            headers["Authorization"] = f"Bearer {token}"
        body = json.dumps(data).encode() if data else None
        req = urllib.request.Request(url, data=body, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req) as resp:
                return json.loads(resp.read().decode())
        except urllib.error.HTTPError as e:
            error_body = e.read().decode() if e.fp else ""
            print(f"  HTTP {e.code} for {method} {url}: {error_body}", file=sys.stderr)
            raise


    def wait_for_api():
        """Wait until the OpenMetadata API is ready."""
        print(f"Waiting for OpenMetadata API at {API} ...")
        for i in range(MAX_RETRIES):
            try:
                api_request("/system/version")
                print("  OpenMetadata API is ready.")
                return
            except Exception:
                print(f"  Attempt {i+1}/{MAX_RETRIES} — not ready, retrying in {RETRY_INTERVAL}s ...")
                time.sleep(RETRY_INTERVAL)
        print("ERROR: OpenMetadata API did not become ready.", file=sys.stderr)
        sys.exit(1)


    def login():
        """Obtain an OM bearer token via Keycloak (OM is in custom-oidc mode, so
        basic /users/login returns 403). Returns a demo-admin access token."""
        print(f"Fetching OpenMetadata token from Keycloak as {OM_ADMIN_USER} ...")
        data = urllib.parse.urlencode({
            "grant_type": "password",
            "client_id": OIDC_CLIENT_ID,
            "client_secret": OIDC_CLIENT_SECRET,
            "username": OM_ADMIN_USER,
            "password": OM_ADMIN_PASSWORD,
            "scope": "openid",
        }).encode()
        req = urllib.request.Request(
            KEYCLOAK_TOKEN_URL, data=data,
            headers={"Content-Type": "application/x-www-form-urlencoded"}, method="POST",
        )
        with urllib.request.urlopen(req) as resp:
            token = json.loads(resp.read().decode()).get("access_token")
        if not token:
            print("ERROR: Keycloak did not return an access token.", file=sys.stderr)
            sys.exit(1)
        print("  Obtained token from Keycloak.")
        return token


    def create_database_service(token):
        """Create or update the Trino database service."""
        print(f"Creating/updating database service '{SERVICE_NAME}' ...")
        payload = {
            "name": SERVICE_NAME,
            "serviceType": "Trino",
            "connection": {
                "config": {
                    "type": "Trino",
                    "scheme": "trino",
                    "hostPort": f"{TRINO_HOST}:{TRINO_PORT}",
                    "username": TRINO_USER,
                    "authType": {"password": TRINO_PASSWORD},
                    "connectionArguments": {
                        "http_scheme": TRINO_SCHEME,
                        "verify": False
                    }
                }
            }
        }
        result = api_request("/services/databaseServices", method="PUT", data=payload, token=token)
        service_id = result["id"]
        fqn = result["fullyQualifiedName"]
        print(f"  Service created/updated: {fqn} (id={service_id})")
        return result


    def create_ingestion_pipeline(token, service):
        """Create or update a metadata ingestion pipeline for the Trino service."""
        print(f"Creating/updating ingestion pipeline '{PIPELINE_NAME}' ...")
        service_ref = {
            "id": service["id"],
            "type": "databaseService"
        }
        payload = {
            "name": PIPELINE_NAME,
            "pipelineType": "metadata",
            "service": service_ref,
            "sourceConfig": {
                "config": {
                    "type": "DatabaseMetadata",
                    "markDeletedTables": True,
                    "includeTables": True,
                    "includeViews": True
                }
            },
            "airflowConfig": {
                "scheduleInterval": "0 */6 * * *"
            }
        }
        result = api_request("/services/ingestionPipelines", method="PUT", data=payload, token=token)
        pipeline_id = result["id"]
        print(f"  Pipeline created/updated: {result['fullyQualifiedName']} (id={pipeline_id})")
        return result


    DBT_PIPELINE_NAME = f"{SERVICE_NAME}_dbt_ingestion"

    S3_ACCESS_KEY = os.environ.get("S3_ACCESS_KEY", "")
    S3_SECRET_KEY = os.environ.get("S3_SECRET_KEY", "")
    S3_ENDPOINT = os.environ.get("S3_ENDPOINT", "http://garage.shared.svc.cluster.local:3900")
    S3_REGION = os.environ.get("S3_REGION", "garage")
    DBT_BUCKET = os.environ.get("DBT_BUCKET", "dbt-artifacts")
    DBT_PREFIX = os.environ.get("DBT_PREFIX", "tpch_demo")


    def create_dbt_pipeline(token, service):
        """Create or update a dbt ingestion pipeline for the Trino service."""
        print(f"Creating/updating dbt pipeline '{DBT_PIPELINE_NAME}' ...")
        service_ref = {
            "id": service["id"],
            "type": "databaseService"
        }
        payload = {
            "name": DBT_PIPELINE_NAME,
            "pipelineType": "dbt",
            "service": service_ref,
            "sourceConfig": {
                "config": {
                    "type": "DBT",
                    "dbtConfigSource": {
                        "dbtConfigType": "s3",
                        "dbtSecurityConfig": {
                            "awsAccessKeyId": S3_ACCESS_KEY,
                            "awsSecretAccessKey": S3_SECRET_KEY,
                            "awsRegion": S3_REGION,
                            "endPointURL": S3_ENDPOINT
                        },
                        "dbtPrefixConfig": {
                            "dbtBucketName": DBT_BUCKET,
                            "dbtObjectPrefix": DBT_PREFIX
                        }
                    },
                    "dbtUpdateDescriptions": True,
                    "includeTags": True
                }
            },
            "airflowConfig": {
                "scheduleInterval": "0 */6 * * *"
            }
        }
        result = api_request("/services/ingestionPipelines", method="PUT", data=payload, token=token)
        pipeline_id = result["id"]
        print(f"  dbt pipeline created/updated: {result['fullyQualifiedName']} (id={pipeline_id})")
        return result


    def trigger_search_reindex(token):
        """Trigger the SearchIndexingApplication to create/update search indexes."""
        print("Triggering search reindex ...")
        url = f"{API}/apps/trigger/SearchIndexingApplication"
        headers = {"Content-Type": "application/json", "Authorization": f"Bearer {token}"}
        req = urllib.request.Request(url, headers=headers, method="POST")
        try:
            with urllib.request.urlopen(req) as resp:
                resp.read()
            print("  Search reindex triggered successfully.")
        except urllib.error.HTTPError as e:
            if e.code == 404:
                print("  WARNING: SearchIndexingApplication not found, skipping reindex.", file=sys.stderr)
            else:
                error_body = e.read().decode() if e.fp else ""
                print(f"  HTTP {e.code} triggering reindex: {error_body}", file=sys.stderr)
                raise


    RIF_BOT_NAME = "resource-info-fetcher"
    RIF_SECRET_NAME = os.environ.get("RIF_SECRET_NAME", "resource-info-fetcher-credentials")
    K8S_SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"


    def ensure_rif_bot(token):
        """Create or update the OM bot the OPA Resource Info Fetcher reads metadata with,
        and return its JWT. The bot keeps OM's DefaultBotRole, which can read tables,
        tags and owners but not change them."""
        print(f"Ensuring bot '{RIF_BOT_NAME}' ...")
        # PUT /users is not idempotent for bot users: OM rejects it with 400 once the
        # user belongs to a bot. So only create user + bot if the bot doesn't exist yet.
        try:
            bot = api_request(f"/bots/name/{RIF_BOT_NAME}", token=token)
            user_id = bot["botUser"]["id"]
            print(f"  Bot '{RIF_BOT_NAME}' already exists.")
        except urllib.error.HTTPError as e:
            if e.code != 404:
                raise
            print(f"Creating bot '{RIF_BOT_NAME}' ...")
            user = api_request("/users", method="PUT", token=token, data={
                "name": RIF_BOT_NAME,
                "displayName": "Resource Info Fetcher (OPA)",
                "email": f"{RIF_BOT_NAME}@stackable.demo",
                "isBot": True,
                "authenticationMechanism": {"authType": "JWT", "config": {"JWTTokenExpiry": "Unlimited"}},
            })
            api_request("/bots", method="PUT", token=token, data={
                "name": RIF_BOT_NAME,
                "displayName": "Resource Info Fetcher (OPA)",
                "description": "Read-only access for the OPA resource-info-fetcher.",
                "botUser": RIF_BOT_NAME,
            })
            user_id = user["id"]
        auth = api_request(f"/users/auth-mechanism/{user_id}", token=token)
        jwt = auth.get("config", {}).get("JWTToken")
        if not jwt:
            print("ERROR: OpenMetadata returned no JWT for the bot.", file=sys.stderr)
            sys.exit(1)
        print(f"  Bot '{RIF_BOT_NAME}' ready.")
        return jwt


    def store_rif_token(jwt):
        """Patch the bot JWT into the Secret the Resource Info Fetcher mounts. The opa
        Application ships it with a placeholder and ignores its data."""
        import base64
        import ssl

        namespace = open(f"{K8S_SA_DIR}/namespace").read().strip()
        sa_token = open(f"{K8S_SA_DIR}/token").read().strip()
        url = f"https://kubernetes.default.svc/api/v1/namespaces/{namespace}/secrets/{RIF_SECRET_NAME}"
        body = json.dumps({"data": {"token": base64.b64encode(jwt.encode()).decode()}}).encode()
        req = urllib.request.Request(url, data=body, method="PATCH", headers={
            "Authorization": f"Bearer {sa_token}",
            "Content-Type": "application/merge-patch+json",
        })
        context = ssl.create_default_context(cafile=f"{K8S_SA_DIR}/ca.crt")
        print(f"Storing the bot token in Secret '{RIF_SECRET_NAME}' ...")
        with urllib.request.urlopen(req, context=context) as resp:
            resp.read()
        print("  Done.")


    def deploy_pipeline(token, pipeline):
        """Deploy an ingestion pipeline to the pipeline service (without triggering a run)."""
        pipeline_id = pipeline["id"]
        fqn = pipeline["fullyQualifiedName"]
        print(f"Deploying pipeline '{fqn}' ...")
        try:
            api_request(f"/services/ingestionPipelines/deploy/{pipeline_id}", method="POST", token=token)
            print(f"  Pipeline '{fqn}' deployed.")
        except urllib.error.HTTPError as e:
            print(f"  WARNING: Failed to deploy pipeline '{fqn}': HTTP {e.code}", file=sys.stderr)


    def main():
        wait_for_api()
        token = login()
        trigger_search_reindex(token)
        service = create_database_service(token)
        metadata_pipeline = create_ingestion_pipeline(token, service)
        dbt_pipeline = create_dbt_pipeline(token, service)
        deploy_pipeline(token, metadata_pipeline)
        deploy_pipeline(token, dbt_pipeline)
        store_rif_token(ensure_rif_bot(token))
        print("Done — Trino is registered in OpenMetadata with metadata and dbt pipelines.")


    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: Job
metadata:
  # A Job's pod template (and auto-generated selector) is immutable. ArgoCD applies
  # this with `kubectl apply`, which creates it cleanly on a fresh deploy; to force
  # recreation after a script/env change on an existing cluster, bump the name
  # suffix (v2 -> v3 ...). NOTE: do NOT use sync-option Replace=true here — for a
  # Job with no explicit selector, `kubectl replace` fails with "selector: Required
  # value / field is immutable" and the job never runs.
  name: configure-openmetadata-v4
  namespace: platform
spec:
  backoffLimit: 50
  template:
    spec:
      # Patches the Resource Info Fetcher token Secret, see the RBAC below.
      serviceAccountName: configure-openmetadata
      containers:
        - name: configure
          image: python:3.12-slim # renovate: datasource=docker depName=python
          command: ["python", "-u", "/scripts/configure.py"]
          env:
            - name: OM_HOST
              value: "http://openmetadata:8585"
            # Keycloak demo-admin credentials for the OM token (custom-oidc mode).
            - name: OM_ADMIN_USER
              value: "demo-admin"
            - name: OM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-demo-passwords
                  key: demo_admin_password
            - name: TRINO_HOST
              value: "trino-coordinator"
            - name: TRINO_PORT
              value: "8443"
            - name: TRINO_SCHEME
              value: "https"
            - name: TRINO_USER
              value: "admin"
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-users
                  key: admin
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garagefs-airflow-credentials
                  key: accessKeyId
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garagefs-airflow-credentials
                  key: secretAccessKey
          volumeMounts:
            - name: script
              mountPath: /scripts
      restartPolicy: OnFailure
      volumes:
        - name: script
          configMap:
            name: openmetadata-init-script
---
# The Job writes the OpenMetadata bot JWT into the Resource Info Fetcher's Secret
# (shipped as a placeholder by the opa Application). Only that one Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: configure-openmetadata
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configure-openmetadata
  namespace: platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["resource-info-fetcher-credentials"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configure-openmetadata
  namespace: platform
subjects:
  - kind: ServiceAccount
    name: configure-openmetadata
    namespace: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configure-openmetadata
