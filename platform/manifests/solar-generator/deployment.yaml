---
# Synthetic PV telemetry for the solar ingestion demo: per-site inverter readings, weather
# stations and cloud polygons, POSTed as NDJSON to NiFi ListenHTTP (nifi-listenhttp.yaml).
# Code and image: the solar-demo project (`generate` entry point); the site catalogue is
# baked into the image. Every env var below is documented in `generate --help`.
#
# Exactly one replica, and Recreate: two generators would duplicate every site.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solar-generator
  namespace: platform
  labels:
    app.kubernetes.io/name: solar-generator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: solar-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solar-generator
    spec:
      containers:
        - name: generator
          image: oci.stackable.tech/sandbox/solar-generator:0.1.3-dev
          imagePullPolicy: Always
          env:
            - name: NIFI_URL
              value: http://nifi-listenhttp:8090/contentListener
            # Region with per-site telemetry, by Kreis code (AGS) prefix, not by name: 01 = all of
            # Schleswig-Holstein (~155,500 sites) plus all parks nationwide, 162,194 sites,
            # ~2,700 records/s. Garage is sized for it (platform/applications/garagefs.yaml).
            - name: REGION_KREIS_PREFIX
              value: "01"
            - name: PARKS_NATIONWIDE
              value: "true"
            - name: TICK_SECONDS
              value: "10"
            - name: TIME_ACCELERATION
              value: "1"
            - name: REPORT_SECONDS
              value: "60"
            - name: FAULT_RATE
              value: "0.01"
            - name: DIRT_RATE
              value: "0.002"
            - name: SEED
              value: "42"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            # Peak ~1.3 GB while loading the nationwide catalogue at startup.
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 2Gi
