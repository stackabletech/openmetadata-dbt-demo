apiVersion: zookeeper.stackable.tech/v1alpha1
kind: ZookeeperCluster
metadata:
  name: simple-zk
  namespace: platform
spec:
  image:
    productVersion: 3.9.4
  clusterConfig:
    vectorAggregatorConfigMapName: vector-aggregator-discovery
  servers:
    config:
      logging:
        enableVectorAgent: true
      resources:
        cpu:
          min: 50m
    roleGroups:
      default:
        replicas: 1
    podOverrides:
      spec:
        containers:
          - name: vector
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
