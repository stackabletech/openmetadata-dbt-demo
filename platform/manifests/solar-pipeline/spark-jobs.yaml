---
# Code of the solar demo's Spark batch jobs, mounted at /stackable/spark/jobs by the
# SparkAppTemplate solar-spark. Airflow (dags/solar_pipeline.py) runs them as SparkApplications.
#
#   bronze.py: Kafka -> bronze, continuous streaming (kept running by DAG solar_bronze_watchdog)
#   dims.py:   master data from Kafka (solar-sites, solar-weather_stations, solar-landkreise) into
#              data2day.solar_silver.dim_site / dim_weather_station / dim_landkreis
#   silver.py: bronze -> silver (checks, quarantine, dedup, energy, performance ratio)
#   gold.py:   silver -> gold (site/fleet 15-min, daily, regions, fault events, data quality)
#   maintenance.py: retention, snapshot expiry and orphan file removal for all solar tables
apiVersion: v1
kind: ConfigMap
metadata:
  name: solar-spark-jobs
  namespace: platform
data:
  solar_common.py: |
    """Shared setup for the solar Spark jobs: Iceberg catalog data2day, S3, Kafka, error logging."""

    import os
    import traceback

    from pyspark.sql import SparkSession

    CATALOG = "data2day"
    S3_ENDPOINT = "http://garage.shared.svc.cluster.local:3900"
    KAFKA_TLS = "/stackable/kafka-tls"

    SITES_ATTRIBUTION = (
        "Marktstammdatenregister - (c) Bundesnetzagentur fuer Elektrizitaet, Gas, "
        "Telekommunikation, Post und Eisenbahnen | dl-de/by-2-0; postcode areas (c) OpenStreetMap "
        "contributors, ODbL-1.0. Site IDs are synthetic; positions of non-park sites are random "
        "points within their postcode area, not real locations."
    )
    LANDKREISE_ATTRIBUTION = (
        "Kreis shapes (c) BKG (2026) dl-de/by-2-0, Datenquellen: "
        "https://sgx.geodatenzentrum.de/web_public/gdz/datenquellen/datenquellen_vg_nuts.pdf; "
        "geometry simplified and reprojected, coastal waters left out."
    )


    def session(app_name):
        """SparkSession with the data2day catalog configured like Trino's."""
        c = f"spark.sql.catalog.{CATALOG}"
        spark = (
            SparkSession.builder.appName(app_name)
            .config(c, "org.apache.iceberg.spark.SparkCatalog")
            .config(f"{c}.type", "rest")
            .config(f"{c}.uri", "http://lakekeeper:8181/catalog")
            .config(f"{c}.warehouse", "data2day")
            .config(f"{c}.rest.auth.type", "oauth2")
            .config(f"{c}.credential", os.environ["LAKEKEEPER_CREDENTIAL"])
            .config(f"{c}.oauth2-server-uri", os.environ["KEYCLOAK_TOKEN_URL"])
            .config(f"{c}.scope", "openid")
            # Keycloak issues 5-minute tokens without refresh token and doesn't allow the token
            # exchange Iceberg refreshes with by default. Refresh with a new client-credentials
            # grant instead; with refresh disabled the streaming job died after ~8 minutes.
            .config(f"{c}.token-refresh-enabled", "true")
            .config(f"{c}.token-exchange-enabled", "false")
            # s3a with the Garage keys; Iceberg's S3FileIO would need Lakekeeper remote signing,
            # which fails here.
            .config(f"{c}.io-impl", "org.apache.iceberg.hadoop.HadoopFileIO")
            .getOrCreate()
        )
        hadoop = spark.sparkContext._jsc.hadoopConfiguration()
        for key, value in {
            "fs.s3.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem",
            "fs.s3a.endpoint": S3_ENDPOINT,
            "fs.s3a.path.style.access": "true",
            "fs.s3a.endpoint.region": "garage",
            "fs.s3a.access.key": os.environ["S3_ACCESS_KEY"],
            "fs.s3a.secret.key": os.environ["S3_SECRET_KEY"],
        }.items():
            hadoop.set(key, value)
        return spark


    def kafka_options(topic):
        """Batch read of a whole topic over TLS."""
        return {
            "kafka.bootstrap.servers": os.environ["KAFKA"],
            "kafka.security.protocol": "SSL",
            "kafka.ssl.truststore.type": "PEM",
            "kafka.ssl.truststore.location": f"{KAFKA_TLS}/ca.crt",
            "subscribe": topic,
            "startingOffsets": "earliest",
            "endingOffsets": "latest",
        }


    def log(spark, name):
        return spark.sparkContext._jvm.org.apache.logging.log4j.LogManager.getLogger(name)


    def run(name, main):
        """Run main(); Python tracebacks go to stderr, which the Vector agent doesn't collect,
        so log them through log4j to get them into OpenSearch."""
        try:
            main()
        except Exception:
            active = SparkSession.getActiveSession()
            if active is not None:
                log(active, name).error(traceback.format_exc())
            raise

  dims.py: |
    """Master data from Kafka into dimension tables (full refresh, latest record per ID).

    The generator publishes its active sites, the weather station grid and the Kreise (code, name,
    shape) to solar-sites, solar-weather_stations and solar-landkreise at startup and every 24 h.
    This job reads the topics completely, keeps the latest record per ID and replaces the tables
    atomically. An empty topic (e.g. after retention) leaves the table untouched.

    Regions are keyed by the Kreis code (kreis_ags), never by name: MaStR names a city and the
    Landkreis around it the same. A site's code is taken from its latest record that has one
    (generators before 0.1.3 don't send it; a site's code doesn't change).
    """

    import sys

    sys.path.insert(0, "/stackable/spark/jobs")

    from pyspark.sql import Window
    from pyspark.sql.functions import (col, current_timestamp, first, from_json, row_number, to_date,
                                       to_timestamp)
    from pyspark.sql.types import BooleanType, DoubleType, StringType, StructField, StructType

    from solar_common import CATALOG, LANDKREISE_ATTRIBUTION, SITES_ATTRIBUTION, kafka_options, log, run, session

    SCHEMA = f"{CATALOG}.solar_silver"

    SITE = StructType([StructField(name, kind) for name, kind in [
        ("published_at", StringType()), ("site_id", StringType()), ("kind", StringType()),
        ("bundesland", StringType()), ("landkreis", StringType()), ("kreis_ags", StringType()),
        ("gemeinde", StringType()), ("plz", StringType()), ("kwp_dc", DoubleType()), ("kw_ac", DoubleType()),
        ("feedin_limit", DoubleType()), ("commissioned", StringType()),
        ("orientation", StringType()), ("azimuth_deg", DoubleType()), ("tilt_deg", DoubleType()),
        ("orientation_imputed", BooleanType()), ("has_storage", BooleanType()),
        ("lat", DoubleType()), ("lon", DoubleType()), ("placement", StringType()),
        ("weather_station_id", StringType()),
    ]])

    LANDKREIS = StructType([StructField(name, kind) for name, kind in [
        ("published_at", StringType()), ("kreis_ags", StringType()), ("name", StringType()),
        ("bez", StringType()), ("bundesland_ags", StringType()), ("bundesland", StringType()),
        ("area_km2", DoubleType()), ("geojson", StringType()),
    ]])

    STATION = StructType([StructField(name, kind) for name, kind in [
        ("published_at", StringType()), ("station_id", StringType()),
        ("lat", DoubleType()), ("lon", DoubleType()),
        ("lat_min", DoubleType()), ("lat_max", DoubleType()),
        ("lon_min", DoubleType()), ("lon_max", DoubleType()),
    ]])


    def latest(spark, topic, schema, key, sticky=()):
        """Latest record per key; columns in `sticky` from the latest record where they're set."""
        raw = spark.read.format("kafka").options(**kafka_options(topic)).load()
        parsed = raw.select(from_json(col("value").cast("string"), schema).alias("r"), col("offset"))
        newest = Window.partitionBy(f"r.{key}").orderBy(col("r.published_at").desc(), col("offset").desc())
        every = newest.rowsBetween(Window.unboundedPreceding, Window.unboundedFollowing)
        df = parsed.where(col(f"r.{key}").isNotNull())
        for c in sticky:
            df = df.withColumn(f"_{c}", first(col(f"r.{c}"), ignorenulls=True).over(every))
        df = (df.withColumn("n", row_number().over(newest)).where("n = 1")
              .select("r.*", *[f"_{c}" for c in sticky]))
        for c in sticky:
            df = df.withColumn(c, col(f"_{c}")).drop(f"_{c}")
        return (df.withColumn("published_at", to_timestamp("published_at"))
                .withColumn("loaded_at", current_timestamp()))


    def replace(spark, df, table, comment):
        count = df.count()
        if count == 0:
            log(spark, "solar_dims").warn(f"No records for {table}, table left unchanged")
            return
        (df.writeTo(f"{SCHEMA}.{table}").using("iceberg")
         .tableProperty("comment", comment).createOrReplace())
        log(spark, "solar_dims").info(f"Replaced {SCHEMA}.{table} with {count} rows")


    def main():
        spark = session("solar-dims")
        spark.sql(f"CREATE NAMESPACE IF NOT EXISTS {SCHEMA}")
        sites = (latest(spark, "solar-sites", SITE, "site_id", sticky=["kreis_ags"])
                 .withColumn("commissioned", to_date("commissioned")))
        replace(spark, sites, "dim_site",
                "Solar demo: active PV sites (latest record per site_id from Kafka topic solar-sites). "
                + SITES_ATTRIBUTION)
        stations = latest(spark, "solar-weather_stations", STATION, "station_id")
        replace(spark, stations, "dim_weather_station",
                "Solar demo: simulated weather stations, one per ~28 x 26 km grid cell (latest record per "
                "station_id from Kafka topic solar-weather_stations). Synthetic data.")
        kreise = latest(spark, "solar-landkreise", LANDKREIS, "kreis_ags")
        replace(spark, kreise, "dim_landkreis",
                "Solar demo: Kreise with code (kreis_ags, AGS), name, Bundesland and simplified shape "
                "(GeoJSON, WGS84), latest record per kreis_ags from Kafka topic solar-landkreise. "
                "Join regions on kreis_ags, not on names. " + LANDKREISE_ATTRIBUTION)


    if __name__ == "__main__":
        run("solar_dims", main)

  silver.py: |
    """Bronze -> silver: parse, check, deduplicate, enrich. Incremental by Kafka offset.

    Per run, for each stream: the bronze rows after the last processed offset (at most
    MAX_ROWS_PER_RUN per partition, so the first run catches up in portions). Rejected rows go
    to solar_silver.quarantine with a reason; the first matching rule wins. Duplicates (within
    the run, or already in silver) are quarantined as `duplicate`, the rest is appended.
    Progress is stored in solar_silver.processing_state after the silver tables are written; a
    re-run after a crash finds the rows already in silver and quarantines them as duplicates.

    Weather runs first, so the inverter readings of the same run can use its irradiance.
    """

    import sys
    from datetime import timedelta

    sys.path.insert(0, "/stackable/spark/jobs")

    from pyspark.sql import Window
    from pyspark.sql import functions as F
    from pyspark.sql.types import DoubleType, IntegerType, StringType, StructField, StructType

    from solar_common import CATALOG, log, run, session

    BRONZE = f"{CATALOG}.solar_bronze"
    SILVER = f"{CATALOG}.solar_silver"
    STATE = f"{SILVER}.processing_state"
    MAX_ROWS_PER_RUN = 3_000_000
    NIGHT_GHI_WM2 = 5.0          # below this the sun is down (or nearly)
    NIGHT_MIN_KW = 0.05          # output above this at night is implausible
    ABOVE_CAPACITY = 1.1         # x kw_ac
    DERATE = 0.8                 # temperature, wiring, inverter losses
    ENERGY_LOOKBACK_HOURS = 3    # how far back to look for a site's previous reading
    # Coarse yield factor per orientation relative to a south-facing array, on horizontal
    # irradiance. Good enough to compare a site with its peers; not a physical model.
    ORIENTATION_FACTOR = {"S": 1.0, "SE": 0.95, "SW": 0.95, "E": 0.85, "W": 0.85, "EW": 0.85,
                          "NE": 0.7, "NW": 0.7, "N": 0.6, "TRACK": 1.15}

    INVERTER = StructType([StructField(n, t) for n, t in [
        ("ts", StringType()), ("site_id", StringType()), ("ac_kw", DoubleType()),
        ("energy_total_kwh", DoubleType()), ("dc_v", DoubleType()), ("inv_temp_c", DoubleType()),
        ("status", StringType())]])
    WEATHER = StructType([StructField(n, t) for n, t in [
        ("ts", StringType()), ("station_id", StringType()), ("ghi_wm2", DoubleType()),
        ("air_temp_c", DoubleType())]])
    CLOUDS = StructType([StructField(n, t) for n, t in [
        ("ts", StringType()), ("part", IntegerType()), ("min_dimming", DoubleType()),
        ("geojson", StringType())]])

    DDL = [
        f"""CREATE TABLE IF NOT EXISTS {SILVER}.inverter_readings (
            site_id STRING, ts TIMESTAMP, ac_kw DOUBLE, energy_total_kwh DOUBLE,
            interval_energy_kwh DOUBLE COMMENT 'Energy since the previous reading; after a counter reset the counter value; null after an implausible jump',
            counter_reset BOOLEAN COMMENT 'Counter went down',
            counter_jump BOOLEAN COMMENT 'Counter went up by more than kw_ac could produce in the elapsed time (e.g. meter replaced)',
            dc_v DOUBLE, inv_temp_c DOUBLE, status STRING,
            plz STRING, landkreis STRING, bundesland STRING, kwp_dc DOUBLE, kw_ac DOUBLE,
            orientation STRING, weather_station_id STRING,
            ghi_wm2 DOUBLE COMMENT 'Measured by the weather station of the site cell, same minute',
            expected_kw DOUBLE COMMENT 'ghi/1000 x kwp x orientation factor x derate, capped at kw_ac and feed-in limit',
            performance_ratio DOUBLE COMMENT 'ac_kw / expected_kw, daylight only',
            kafka_offset BIGINT, ingested_at TIMESTAMP, processed_at TIMESTAMP)
           USING iceberg PARTITIONED BY (days(ts))
           COMMENT 'Solar demo silver: checked, deduplicated and enriched inverter readings (synthetic data)'""",
        f"""CREATE TABLE IF NOT EXISTS {SILVER}.weather_readings (
            station_id STRING, ts TIMESTAMP, ghi_wm2 DOUBLE, air_temp_c DOUBLE,
            kafka_offset BIGINT, ingested_at TIMESTAMP, processed_at TIMESTAMP)
           USING iceberg PARTITIONED BY (days(ts))
           COMMENT 'Solar demo silver: checked and deduplicated weather station readings (synthetic data)'""",
        f"""CREATE TABLE IF NOT EXISTS {SILVER}.cloud_polygons (
            ts TIMESTAMP, part INT, min_dimming DOUBLE, geojson STRING, processed_at TIMESTAMP)
           USING iceberg PARTITIONED BY (days(ts))
           COMMENT 'Solar demo silver: simulated cloud cover as GeoJSON polygons, for map overlays only'""",
        f"""CREATE TABLE IF NOT EXISTS {SILVER}.quarantine (
            stream STRING, reason STRING, value STRING, kafka_partition INT, kafka_offset BIGINT,
            kafka_timestamp TIMESTAMP, ingested_at TIMESTAMP, quarantined_at TIMESTAMP)
           USING iceberg PARTITIONED BY (days(quarantined_at))
           COMMENT 'Solar demo silver: rejected bronze rows with the reason (first matching rule)'""",
        f"""CREATE TABLE IF NOT EXISTS {STATE} (
            source STRING, kafka_partition INT, last_offset BIGINT, processed_at TIMESTAMP)
           USING iceberg
           COMMENT 'Solar demo silver: last processed Kafka offset per bronze table and partition'""",
    ]


    def new_rows(spark, stream):
        """Bronze rows after the last processed offset, at most MAX_ROWS_PER_RUN per partition."""
        state = (spark.table(STATE).where(F.col("source") == stream)
                 .select("kafka_partition", "last_offset"))
        last = F.coalesce(F.col("last_offset"), F.lit(-1))
        return (spark.table(f"{BRONZE}.{stream}_raw")
                .join(state, "kafka_partition", "left")
                .where((F.col("kafka_offset") > last) & (F.col("kafka_offset") <= last + MAX_ROWS_PER_RUN))
                .drop("last_offset"))


    def quarantine(rows, stream, reason_col="reason"):
        (rows.select(F.lit(stream).alias("stream"), F.col(reason_col).alias("reason"), "value",
                     "kafka_partition", "kafka_offset", "kafka_timestamp", "ingested_at",
                     F.current_timestamp().alias("quarantined_at"))
         .writeTo(f"{SILVER}.quarantine").append())


    def first_failure(rules):
        """Reason of the first matching rule, else null."""
        expr = F.lit(None).cast("string")
        for condition, reason in reversed(rules):
            expr = F.when(condition, F.lit(reason)).otherwise(expr)
        return expr


    def split_duplicates(spark, rows, keys, table):
        """(new, duplicates): duplicates within the run (keep the lowest offset) or already in table."""
        n = F.row_number().over(Window.partitionBy(*keys).orderBy("kafka_offset"))
        ranked = rows.withColumn("n", n)
        firsts = ranked.where("n = 1").drop("n")
        repeats = ranked.where("n > 1").drop("n")
        bounds = firsts.agg(F.min("ts"), F.max("ts")).first()
        if bounds[0] is None:
            return firsts, repeats
        existing = (spark.table(table).where(F.col("ts").between(bounds[0], bounds[1]))
                    .select(*keys).distinct())
        new = firsts.join(existing, keys, "left_anti")
        known = firsts.join(existing, keys, "left_semi")
        return new, repeats.unionByName(known)


    def parsed(batch, schema):
        return (batch.withColumn("r", F.from_json("value", schema))
                .select("*", "r.*").drop("r")
                .withColumn("ts", F.to_timestamp("ts")))


    def process_weather(spark, batch):
        stations = spark.table(f"{SILVER}.dim_weather_station").select("station_id", F.lit(True).alias("known"))
        rows = parsed(batch, WEATHER).join(stations, "station_id", "left")
        rows = rows.withColumn("reason", first_failure([
            (F.col("ts").isNull() | F.col("station_id").isNull() | F.col("ghi_wm2").isNull(), "missing_required"),
            (F.col("known").isNull(), "unknown_station"),
            (F.col("ghi_wm2") < 0, "negative_irradiance"),
        ])).cache()
        quarantine(rows.where(F.col("reason").isNotNull()), "weather")
        new, dups = split_duplicates(spark, rows.where(F.col("reason").isNull()), ["station_id", "ts"],
                                     f"{SILVER}.weather_readings")
        quarantine(dups.withColumn("reason", F.lit("duplicate")), "weather")
        (new.select("station_id", "ts", "ghi_wm2", "air_temp_c", "kafka_offset", "ingested_at",
                    F.current_timestamp().alias("processed_at"))
         .writeTo(f"{SILVER}.weather_readings").append())


    def process_inverter(spark, batch):
        sites = spark.table(f"{SILVER}.dim_site").select(
            "site_id", "plz", "landkreis", "bundesland", "kwp_dc", "kw_ac", "feedin_limit",
            "orientation", "weather_station_id")
        rows = parsed(batch, INVERTER).join(sites, "site_id", "left")
        bounds = rows.agg(F.min("ts"), F.max("ts")).first()
        if bounds[0] is not None:
            # Irradiance of the site's weather station in the same minute.
            weather = (spark.table(f"{SILVER}.weather_readings")
                       .where(F.col("ts").between(bounds[0] - timedelta(minutes=10), bounds[1]))
                       .groupBy(F.col("station_id").alias("weather_station_id"),
                                F.date_trunc("minute", "ts").alias("minute"))
                       .agg(F.avg("ghi_wm2").alias("ghi_wm2")))
            rows = (rows.withColumn("minute", F.date_trunc("minute", "ts"))
                    .join(weather, ["weather_station_id", "minute"], "left").drop("minute"))
        else:
            rows = rows.withColumn("ghi_wm2", F.lit(None).cast("double"))
        rows = rows.withColumn("reason", first_failure([
            (F.col("ts").isNull() | F.col("site_id").isNull() | F.col("ac_kw").isNull(), "missing_required"),
            (F.col("kwp_dc").isNull(), "unknown_site"),
            (F.col("ac_kw") < 0, "negative_power"),
            (F.col("ac_kw") > F.col("kw_ac") * ABOVE_CAPACITY, "above_capacity"),
            ((F.col("ghi_wm2") < NIGHT_GHI_WM2) & (F.col("ac_kw") > NIGHT_MIN_KW), "output_at_night"),
        ])).cache()
        quarantine(rows.where(F.col("reason").isNotNull()), "inverter")
        new, dups = split_duplicates(spark, rows.where(F.col("reason").isNull()), ["site_id", "ts"],
                                     f"{SILVER}.inverter_readings")
        quarantine(dups.withColumn("reason", F.lit("duplicate")), "inverter")
        new = new.cache()
        if new.isEmpty():
            return

        # Energy since the nearest earlier reading of the same site (from silver or this run).
        lo = new.agg(F.min("ts")).first()[0]
        previous = (spark.table(f"{SILVER}.inverter_readings")
                    .where(F.col("ts") >= lo - timedelta(hours=ENERGY_LOOKBACK_HOURS))
                    .join(new.select("site_id").distinct(), "site_id", "left_semi")
                    .select("site_id", "ts", "energy_total_kwh", "kw_ac", F.lit(False).alias("is_new")))
        timeline = previous.unionByName(
            new.select("site_id", "ts", "energy_total_kwh", "kw_ac", F.lit(True).alias("is_new")))
        by_site = Window.partitionBy("site_id").orderBy("ts")
        hours = (F.col("ts").cast("long") - F.lag("ts").over(by_site).cast("long")) / 3600
        # A counter that goes up by more than the inverter could produce in the elapsed time was
        # replaced or re-initialised (e.g. a generator restart after a reset): no interval value.
        plausible_max = F.col("kw_ac") * hours * ABOVE_CAPACITY + 0.01
        energy = (timeline
                  .withColumn("delta", F.col("energy_total_kwh") - F.lag("energy_total_kwh").over(by_site))
                  .withColumn("max_kwh", plausible_max)
                  .where("is_new")
                  .select("site_id", "ts",
                          (F.col("delta") < 0).alias("counter_reset"),
                          (F.col("delta") > F.col("max_kwh")).alias("counter_jump"),
                          F.when(F.col("delta") < 0, F.col("energy_total_kwh"))
                          .when(F.col("delta") > F.col("max_kwh"), F.lit(None))
                          .otherwise(F.col("delta")).alias("interval_energy_kwh")))

        factor = F.create_map(*[F.lit(x) for kv in ORIENTATION_FACTOR.items() for x in kv])[F.col("orientation")]
        cap = F.least(F.col("kw_ac"), F.coalesce(F.col("feedin_limit") * F.col("kwp_dc"), F.col("kw_ac")))
        # least() ignores nulls: without a weather reading there is no expected output.
        expected = F.when(F.col("ghi_wm2").isNotNull(), F.least(
            F.col("ghi_wm2") / 1000 * F.col("kwp_dc") * F.coalesce(factor, F.lit(0.8)) * DERATE, cap))
        out = (new.join(energy, ["site_id", "ts"], "left")
               .withColumn("expected_kw", expected)
               .withColumn("performance_ratio",
                           F.when(F.col("expected_kw") > 0.05 * F.col("kwp_dc"), F.col("ac_kw") / F.col("expected_kw")))
               .withColumn("processed_at", F.current_timestamp()))
        (out.select("site_id", "ts", "ac_kw", "energy_total_kwh", "interval_energy_kwh", "counter_reset",
                    "counter_jump", "dc_v", "inv_temp_c", "status", "plz", "landkreis", "bundesland", "kwp_dc", "kw_ac",
                    "orientation", "weather_station_id", "ghi_wm2", "expected_kw", "performance_ratio",
                    "kafka_offset", "ingested_at", "processed_at")
         .writeTo(f"{SILVER}.inverter_readings").append())


    def process_clouds(spark, batch):
        rows = parsed(batch, CLOUDS).withColumn("reason", first_failure([
            (F.col("ts").isNull() | F.col("part").isNull() | F.col("geojson").isNull(), "missing_required"),
        ])).cache()
        quarantine(rows.where(F.col("reason").isNotNull()), "clouds")
        new, dups = split_duplicates(spark, rows.where(F.col("reason").isNull()), ["ts", "part"],
                                     f"{SILVER}.cloud_polygons")
        quarantine(dups.withColumn("reason", F.lit("duplicate")), "clouds")
        (new.select("ts", "part", "min_dimming", "geojson", F.current_timestamp().alias("processed_at"))
         .writeTo(f"{SILVER}.cloud_polygons").append())


    def advance(spark, stream, batch):
        done = (batch.groupBy("kafka_partition").agg(F.max("kafka_offset").alias("last_offset"))
                .select(F.lit(stream).alias("source"), "kafka_partition", "last_offset",
                        F.current_timestamp().alias("processed_at")))
        others = spark.table(STATE).join(done.select("source", "kafka_partition"),
                                         ["source", "kafka_partition"], "left_anti")
        state = others.unionByName(done).localCheckpoint()   # read STATE fully before overwriting it
        state.writeTo(STATE).overwrite(F.lit(True))


    def main():
        spark = session("solar-silver")
        logger = log(spark, "solar_silver")
        for ddl in DDL:
            spark.sql(ddl)
        for stream, process in [("weather", process_weather), ("inverter", process_inverter),
                                ("clouds", process_clouds)]:
            batch = new_rows(spark, stream).cache()
            count = batch.count()
            if count == 0:
                logger.info(f"{stream}: nothing new")
                continue
            process(spark, batch)
            advance(spark, stream, batch)
            logger.info(f"{stream}: processed {count} bronze rows")
            batch.unpersist()


    if __name__ == "__main__":
        run("solar_silver", main)

  gold.py: |
    """Silver -> gold: aggregates for dashboards and fault detection. Incremental.

    Each run finds the silver inverter rows processed since the last gold run, takes the
    earliest 15-minute slot they touch (late readings included) and recomputes everything from
    there: site_15min from silver, then fleet_15min, site_daily, region_daily, fault_events and
    dq_daily for the affected slots and days. Tables are updated with one MERGE each, which
    also deletes rows in the window that no longer exist (one commit per table).

    Regions are keyed by the Kreis code (kreis_ags, from dim_site by site_id); the Landkreis and
    Bundesland names are labels from dim_landkreis, looked up by code. Never join or group on
    names: MaStR names a city and the Landkreis around it the same (e.g. Muenchen).
    Tables from before the codes (no kreis_ags column) are dropped and rebuilt from silver.
    """

    import sys
    from datetime import timedelta

    sys.path.insert(0, "/stackable/spark/jobs")

    from pyspark.sql import functions as F

    from solar_common import CATALOG, log, run, session

    SILVER = f"{CATALOG}.solar_silver"
    GOLD = f"{CATALOG}.solar_gold"
    SLOT_SECONDS = 900
    UNDERPERFORMING = 0.75   # below this share of the peers' median performance ratio
    MIN_PEERS = 5            # peer group: same weather cell and orientation, same slot
    MIN_PEER_PR = 0.3        # peers must be producing (daylight, not overcast to nothing)

    DDL = [
        f"""CREATE TABLE IF NOT EXISTS {GOLD}.site_15min (
            site_id STRING, slot TIMESTAMP, plz STRING, kreis_ags STRING, landkreis STRING,
            bundesland_ags STRING, bundesland STRING, weather_station_id STRING, orientation STRING, kwp_dc DOUBLE, readings INT,
            avg_ac_kw DOUBLE, energy_kwh DOUBLE, expected_kwh DOUBLE, performance_ratio DOUBLE,
            fault_readings INT COMMENT 'Readings with inverter status FAULT',
            peer_sites INT, peer_pr DOUBLE COMMENT 'Median performance ratio of the peer group',
            peer_ratio DOUBLE COMMENT 'performance_ratio / peer_pr',
            underperforming BOOLEAN, updated_at TIMESTAMP)
           USING iceberg PARTITIONED BY (days(slot))
           COMMENT 'Solar demo gold: per site and 15-minute slot, with the comparison against peers (same weather cell and orientation)'""",
        f"""CREATE TABLE IF NOT EXISTS {GOLD}.fleet_15min (
            plz STRING, slot TIMESTAMP,
            kreis_ags STRING COMMENT 'Kreis of most sites in the postcode (a postcode can cross Kreis borders)',
            landkreis STRING, bundesland_ags STRING, bundesland STRING, sites INT, kwp_dc DOUBLE,
            power_kw DOUBLE, energy_kwh DOUBLE, expected_kwh DOUBLE, performance_ratio DOUBLE,
            underperforming_sites INT, updated_at TIMESTAMP)
           USING iceberg PARTITIONED BY (days(slot))
           COMMENT 'Solar demo gold: per postcode and 15-minute slot (the market interval)'""",
        f"""CREATE TABLE IF NOT EXISTS {GOLD}.site_daily (
            site_id STRING, day DATE, plz STRING, kreis_ags STRING, landkreis STRING,
            bundesland_ags STRING, bundesland STRING, kwp_dc DOUBLE, energy_kwh DOUBLE, expected_kwh DOUBLE, performance_ratio DOUBLE, specific_yield_kwh_kwp DOUBLE,
            underperforming_slots INT, fault_slots INT, updated_at TIMESTAMP)
           USING iceberg PARTITIONED BY (day)
           COMMENT 'Solar demo gold: per site and day'""",
        f"""CREATE TABLE IF NOT EXISTS {GOLD}.region_daily (
            day DATE, kreis_ags STRING COMMENT 'Kreis code (AGS), the key; names are labels',
            landkreis STRING, bundesland_ags STRING, bundesland STRING, sites INT, kwp_dc DOUBLE,
            energy_kwh DOUBLE, specific_yield_kwh_kwp DOUBLE, capacity_factor DOUBLE, updated_at TIMESTAMP)
           USING iceberg PARTITIONED BY (day)
           COMMENT 'Solar demo gold: per Kreis (kreis_ags) and day (sum over Kreise = Bundesland)'""",
        f"""CREATE TABLE IF NOT EXISTS {GOLD}.fault_events (
            site_id STRING, start_slot TIMESTAMP, end_slot TIMESTAMP, slots INT, duration_minutes INT,
            plz STRING, kreis_ags STRING, landkreis STRING, weather_station_id STRING, kwp_dc DOUBLE,
            min_peer_ratio DOUBLE, lost_energy_kwh DOUBLE COMMENT 'sum of (peer_pr x expected - actual)',
            inverter_fault_reported BOOLEAN, updated_at TIMESTAMP)
           USING iceberg PARTITIONED BY (days(start_slot))
           COMMENT 'Solar demo gold: contiguous underperforming 15-minute slots per site (synthetic site IDs)'""",
        f"""CREATE TABLE IF NOT EXISTS {GOLD}.dq_daily (
            day DATE, stream STRING, reason STRING, records BIGINT, updated_at TIMESTAMP)
           USING iceberg PARTITIONED BY (day)
           COMMENT 'Solar demo gold: quarantined records per day (Kafka timestamp), stream and reason'""",
        f"""CREATE TABLE IF NOT EXISTS {GOLD}.watermark (
            table_name STRING, processed_until TIMESTAMP, updated_at TIMESTAMP)
           USING iceberg
           COMMENT 'Solar demo gold: slots before processed_until are complete (apart from late data)'""",
        f"""CREATE TABLE IF NOT EXISTS {GOLD}.processing_state (
            name STRING, value TIMESTAMP)
           USING iceberg COMMENT 'Solar demo gold: last silver processed_at seen'""",
    ]


    # Built per Kreis code; older versions of these tables grouped by name and are rebuilt.
    KEYED_BY_CODE = ["site_15min", "fleet_15min", "site_daily", "region_daily", "fault_events"]


    def rebuild_tables_without_codes(spark, logger):
        """Drop the gold tables that predate kreis_ags, and the state, so this run rebuilds them."""
        existing = {r.tableName for r in spark.sql(f"SHOW TABLES IN {GOLD}").collect()}
        old = [t for t in KEYED_BY_CODE
               if t in existing and "kreis_ags" not in spark.table(f"{GOLD}.{t}").columns]
        if not old:
            return
        for t in old:
            # No PURGE: Spark would then delete every file the table ever referenced and fails on
            # the metadata files maintenance already removed. Lakekeeper cleans up dropped tables.
            spark.sql(f"DROP TABLE {GOLD}.{t}")
        spark.sql(f"DELETE FROM {GOLD}.processing_state")
        logger.info(f"Dropped {', '.join(old)} (no kreis_ags); rebuilding gold from silver")


    def slot(col):
        return F.from_unixtime(F.floor(F.unix_timestamp(col) / SLOT_SECONDS) * SLOT_SECONDS).cast("timestamp")


    def replace_window(spark, df, table, keys, window_sql):
        """Upsert df into table and delete table rows inside the window that df no longer has."""
        df.createOrReplaceTempView("src")
        on = " AND ".join(f"t.{k} = s.{k}" for k in keys)
        spark.sql(f"""
            MERGE INTO {table} t USING src s ON {on}
            WHEN MATCHED THEN UPDATE SET *
            WHEN NOT MATCHED THEN INSERT *
            WHEN NOT MATCHED BY SOURCE AND {window_sql} THEN DELETE
        """)


    def main():
        spark = session("solar-gold")
        logger = log(spark, "solar_gold")
        spark.sql(f"CREATE NAMESPACE IF NOT EXISTS {GOLD}")
        if not spark.catalog.tableExists(f"{SILVER}.dim_landkreis"):
            raise RuntimeError(f"{SILVER}.dim_landkreis missing: run solar_dims first (needs the "
                               "generator's solar-landkreise stream)")
        spark.sql(DDL[-1])  # processing_state
        rebuild_tables_without_codes(spark, logger)
        for ddl in DDL:
            spark.sql(ddl)
        now = spark.sql("SELECT current_timestamp()").first()[0]

        last = spark.table(f"{GOLD}.processing_state").where("name = 'silver_processed_at'").first()
        readings = spark.table(f"{SILVER}.inverter_readings")
        changed = readings if last is None else readings.where(F.col("processed_at") > last["value"])
        bounds = changed.agg(F.min("ts"), F.max("processed_at")).first()
        if bounds[0] is None:
            logger.info("No new silver rows")
            return
        start = bounds[0] - timedelta(seconds=bounds[0].timestamp() % SLOT_SECONDS)
        seen_until = bounds[1]
        first_day = start.date()
        logger.info(f"Recomputing slots from {start}")

        # Kreis code per site (by site_id) and the labels for it (by code)
        kreise = spark.table(f"{SILVER}.dim_landkreis").select(
            "kreis_ags", F.col("name").alias("landkreis"), "bundesland_ags", "bundesland")
        regions = (spark.table(f"{SILVER}.dim_site").select("site_id", "kreis_ags")
                   .join(kreise, "kreis_ags", "left"))
        unknown = regions.where(F.col("kreis_ags").isNull() | F.col("landkreis").isNull()).count()
        if unknown:
            logger.warn(f"{unknown} sites without a Kreis code or with a code not in dim_landkreis")

        # site_15min with the peer comparison
        per_site = (readings.where(F.col("ts") >= start)
                    .groupBy("site_id", slot("ts").alias("slot"))
                    .agg(F.first("plz").alias("plz"),
                         F.first("weather_station_id").alias("weather_station_id"),
                         F.first("orientation").alias("orientation"), F.first("kwp_dc").alias("kwp_dc"),
                         F.count("*").cast("int").alias("readings"),
                         F.avg("ac_kw").alias("avg_ac_kw"),
                         F.sum("interval_energy_kwh").alias("energy_kwh"),
                         (F.avg("expected_kw") * SLOT_SECONDS / 3600).alias("expected_kwh"),
                         # Daylight only, as in silver: at night the sensor noise gives tiny expected values.
                         F.when(F.avg("expected_kw") > 0.05 * F.first("kwp_dc"),
                                F.avg("ac_kw") / F.avg("expected_kw")).alias("performance_ratio"),
                         F.sum(F.when(F.col("status") == "FAULT", 1).otherwise(0)).cast("int").alias("fault_readings"))
                    .join(F.broadcast(regions), "site_id", "left"))
        per_site.createOrReplaceTempView("per_site")
        site_15min = spark.sql(f"""
            SELECT p.site_id, p.slot, p.plz, p.kreis_ags, p.landkreis, p.bundesland_ags, p.bundesland,
                   p.weather_station_id, p.orientation, p.kwp_dc, p.readings, p.avg_ac_kw, p.energy_kwh,
                   p.expected_kwh, p.performance_ratio, p.fault_readings,
                   g.peer_sites, g.peer_pr, p.performance_ratio / g.peer_pr AS peer_ratio,
                   coalesce(g.peer_sites >= {MIN_PEERS} AND g.peer_pr >= {MIN_PEER_PR}
                            AND p.performance_ratio / g.peer_pr < {UNDERPERFORMING}, false) AS underperforming,
                   current_timestamp() AS updated_at
            FROM per_site p
            LEFT JOIN (SELECT weather_station_id, orientation, slot, count(*) AS peer_sites,
                              percentile_approx(performance_ratio, 0.5) AS peer_pr
                       FROM per_site WHERE performance_ratio IS NOT NULL
                       GROUP BY weather_station_id, orientation, slot) g
              USING (weather_station_id, orientation, slot)
        """).withColumn("peer_sites", F.col("peer_sites").cast("int")).cache()
        replace_window(spark, site_15min, f"{GOLD}.site_15min", ["site_id", "slot"],
                       f"t.slot >= TIMESTAMP '{start}'")

        # Everything else from site_15min, for the affected slots and days
        s15 = spark.table(f"{GOLD}.site_15min")
        fleet = (s15.where(F.col("slot") >= start)
                 .groupBy("plz", "slot")
                 .agg(F.mode("kreis_ags").alias("kreis_ags"),
                      F.count("*").cast("int").alias("sites"), F.sum("kwp_dc").alias("kwp_dc"),
                      F.sum("avg_ac_kw").alias("power_kw"), F.sum("energy_kwh").alias("energy_kwh"),
                      F.sum("expected_kwh").alias("expected_kwh"),
                      F.when(F.sum("expected_kwh") > 0.05 * F.sum("kwp_dc") * SLOT_SECONDS / 3600,
                             F.sum("avg_ac_kw") * SLOT_SECONDS / 3600 / F.sum("expected_kwh")).alias("performance_ratio"),
                      F.sum(F.col("underperforming").cast("int")).cast("int").alias("underperforming_sites"))
                 .join(F.broadcast(kreise), "kreis_ags", "left")
                 .withColumn("updated_at", F.current_timestamp())
                 .select("plz", "slot", "kreis_ags", "landkreis", "bundesland_ags", "bundesland", "sites",
                         "kwp_dc", "power_kw", "energy_kwh", "expected_kwh", "performance_ratio",
                         "underperforming_sites", "updated_at"))
        replace_window(spark, fleet, f"{GOLD}.fleet_15min", ["plz", "slot"], f"t.slot >= TIMESTAMP '{start}'")

        days = s15.where(F.to_date("slot") >= F.lit(first_day))
        site_daily = (days.groupBy("site_id", F.to_date("slot").alias("day"))
                      .agg(F.first("plz").alias("plz"), F.first("kreis_ags").alias("kreis_ags"),
                           F.first("landkreis").alias("landkreis"),
                           F.first("bundesland_ags").alias("bundesland_ags"),
                           F.first("bundesland").alias("bundesland"), F.first("kwp_dc").alias("kwp_dc"),
                           F.sum("energy_kwh").alias("energy_kwh"), F.sum("expected_kwh").alias("expected_kwh"),
                           F.sum(F.col("underperforming").cast("int")).cast("int").alias("underperforming_slots"),
                           F.sum(F.when(F.col("fault_readings") > 0, 1).otherwise(0)).cast("int").alias("fault_slots"))
                      .withColumn("performance_ratio", F.col("energy_kwh") / F.col("expected_kwh"))
                      .withColumn("specific_yield_kwh_kwp", F.col("energy_kwh") / F.col("kwp_dc"))
                      .withColumn("updated_at", F.current_timestamp())
                      .select("site_id", "day", "plz", "kreis_ags", "landkreis", "bundesland_ags", "bundesland",
                              "kwp_dc", "energy_kwh",
                              "expected_kwh", "performance_ratio", "specific_yield_kwh_kwp",
                              "underperforming_slots", "fault_slots", "updated_at")
                      .cache())
        replace_window(spark, site_daily, f"{GOLD}.site_daily", ["site_id", "day"], f"t.day >= DATE '{first_day}'")

        # Sites without a code stay out of the regions (a null key would never match in the MERGE).
        region = (site_daily.where(F.col("kreis_ags").isNotNull())
                  .groupBy("day", "kreis_ags")
                  .agg(F.count("*").cast("int").alias("sites"), F.sum("kwp_dc").alias("kwp_dc"),
                       F.sum("energy_kwh").alias("energy_kwh"))
                  .join(F.broadcast(kreise), "kreis_ags", "left")
                  .withColumn("specific_yield_kwh_kwp", F.col("energy_kwh") / F.col("kwp_dc"))
                  .withColumn("capacity_factor", F.col("energy_kwh") / (F.col("kwp_dc") * 24))
                  .withColumn("updated_at", F.current_timestamp())
                  .select("day", "kreis_ags", "landkreis", "bundesland_ags", "bundesland", "sites", "kwp_dc",
                          "energy_kwh", "specific_yield_kwh_kwp", "capacity_factor", "updated_at"))
        replace_window(spark, region, f"{GOLD}.region_daily", ["day", "kreis_ags"],
                       f"t.day >= DATE '{first_day}'")

        # Fault events: islands of consecutive underperforming slots per site, in the affected days.
        days.createOrReplaceTempView("days")
        events = spark.sql(f"""
            WITH u AS (
                SELECT *, (unix_timestamp(slot) / {SLOT_SECONDS})
                          - row_number() OVER (PARTITION BY site_id ORDER BY slot) AS island
                FROM days WHERE underperforming
            )
            SELECT site_id, min(slot) AS start_slot, max(slot) AS end_slot,
                   CAST(count(*) AS INT) AS slots, CAST(count(*) * {SLOT_SECONDS // 60} AS INT) AS duration_minutes,
                   first(plz) AS plz, first(kreis_ags) AS kreis_ags, first(landkreis) AS landkreis,
                   first(weather_station_id) AS weather_station_id, first(kwp_dc) AS kwp_dc,
                   min(peer_ratio) AS min_peer_ratio,
                   sum(greatest(peer_pr * expected_kwh - coalesce(energy_kwh, 0), 0)) AS lost_energy_kwh,
                   max(fault_readings) > 0 AS inverter_fault_reported,
                   current_timestamp() AS updated_at
            FROM u GROUP BY site_id, island
        """)
        replace_window(spark, events, f"{GOLD}.fault_events", ["site_id", "start_slot"],
                       f"t.start_slot >= TIMESTAMP '{first_day} 00:00:00'")

        dq = (spark.table(f"{SILVER}.quarantine")
              .where(F.to_date("kafka_timestamp") >= F.lit(first_day))
              .groupBy(F.to_date("kafka_timestamp").alias("day"), "stream", "reason")
              .agg(F.count("*").alias("records"))
              .withColumn("updated_at", F.current_timestamp()))
        replace_window(spark, dq, f"{GOLD}.dq_daily", ["day", "stream", "reason"], f"t.day >= DATE '{first_day}'")

        clouds = spark.table(f"{SILVER}.cloud_polygons")
        latest = clouds.agg(F.max("ts")).first()[0]
        if latest is not None:
            (clouds.where(F.col("ts") == latest).select("ts", "part", "min_dimming", "geojson")
             .writeTo(f"{GOLD}.cloud_cover").using("iceberg")
             .tableProperty("comment", "Solar demo gold: latest simulated cloud cover snapshot, for map overlays only")
             .createOrReplace())

        # fleet_15min is complete up to the slot of the newest silver reading (late data aside).
        newest = readings.agg(F.max("ts")).first()[0]
        until = newest - timedelta(seconds=newest.timestamp() % SLOT_SECONDS)
        spark.createDataFrame([("fleet_15min", until, now)], "table_name string, processed_until timestamp, updated_at timestamp") \
            .writeTo(f"{GOLD}.watermark").overwrite(F.lit(True))
        spark.createDataFrame([("silver_processed_at", seen_until)], "name string, value timestamp") \
            .writeTo(f"{GOLD}.processing_state").overwrite(F.lit(True))
        logger.info(f"Gold updated from slot {start}, fleet_15min complete until {until}")


    if __name__ == "__main__":
        run("solar_gold", main)

  maintenance.py: |
    """Housekeeping for the solar tables (hourly): keeps the lakehouse within the small Garage volumes.

    Once filled up by 1-minute bronze commits that nobody cleaned up, Garage lost blocks of
    committed files. Per table in solar_bronze, solar_silver and solar_gold:
      - old metadata files are deleted on commit (keep the last 20),
      - retention: bronze 2 days (Kafka holds less, silver has everything), silver readings
        7 days; gold, the dimensions and the state tables are kept,
      - snapshots older than an hour expire (the last 10 are kept),
      - files no snapshot references and older than a day are removed (failed writes).
    Retention deletes whole day partitions, so they only touch metadata.
    """

    import sys
    from datetime import datetime, timedelta, timezone

    sys.path.insert(0, "/stackable/spark/jobs")

    from solar_common import CATALOG, log, run, session

    # table -> (timestamp column partitioned by day, days to keep)
    RETENTION = {
        "solar_bronze.inverter_raw": ("kafka_timestamp", 2),
        "solar_bronze.weather_raw": ("kafka_timestamp", 2),
        "solar_bronze.clouds_raw": ("kafka_timestamp", 2),
        "solar_silver.inverter_readings": ("ts", 7),
        "solar_silver.weather_readings": ("ts", 7),
        "solar_silver.cloud_polygons": ("ts", 7),
        "solar_silver.quarantine": ("quarantined_at", 7),
    }


    def main():
        spark = session("solar-maintenance")
        logger = log(spark, "solar_maintenance")
        now = datetime.now(timezone.utc)
        snapshots_before = (now - timedelta(hours=1)).strftime("%Y-%m-%d %H:%M:%S")
        orphans_before = (now - timedelta(days=1)).strftime("%Y-%m-%d %H:%M:%S")
        tables = [f"{schema}.{row.tableName}"
                  for schema in ("solar_bronze", "solar_silver", "solar_gold")
                  for row in spark.sql(f"SHOW TABLES IN {CATALOG}.{schema}").collect()]
        for table in tables:
            name = f"{CATALOG}.{table}"
            spark.sql(f"""ALTER TABLE {name} SET TBLPROPERTIES (
                'write.metadata.delete-after-commit.enabled' = 'true',
                'write.metadata.previous-versions-max' = '20')""")
            if table in RETENTION:
                column, days = RETENTION[table]
                cutoff = (now - timedelta(days=days)).strftime("%Y-%m-%d")
                spark.sql(f"DELETE FROM {name} WHERE {column} < TIMESTAMP '{cutoff} 00:00:00'")
            expired = spark.sql(f"""CALL {CATALOG}.system.expire_snapshots(
                table => '{table}', older_than => TIMESTAMP '{snapshots_before}', retain_last => 10)""").first()
            orphans = spark.sql(f"""CALL {CATALOG}.system.remove_orphan_files(
                table => '{table}', older_than => TIMESTAMP '{orphans_before}',
                equal_schemes => map('s3a', 's3'))""").count()
            logger.info(f"{table}: expired {expired.deleted_data_files_count} data and "
                        f"{expired.deleted_manifest_files_count} manifest files, removed {orphans} orphan files")


    if __name__ == "__main__":
        run("solar_maintenance", main)

  bronze.py: |
    """Bronze: Kafka -> Iceberg, continuously (Spark Structured Streaming).

      solar-inverter -> solar_bronze.inverter_raw
      solar-weather  -> solar_bronze.weather_raw
      solar-clouds   -> solar_bronze.clouds_raw

    One row per Kafka message: the message as received, its Kafka coordinates and the ingest
    time; append-only, partitioned by day. Runs until it fails; the Airflow DAG
    solar_bronze_watchdog starts a new one, which resumes from the checkpoints.
    """

    import os
    import sys

    sys.path.insert(0, "/stackable/spark/jobs")

    from pyspark.sql.functions import col, current_timestamp

    from solar_common import CATALOG, KAFKA_TLS, run, session

    SCHEMA = f"{CATALOG}.solar_bronze"
    STREAMS = ["inverter", "weather", "clouds"]
    CHECKPOINTS = "s3a://iceberg-warehouse/checkpoints/solar-bronze"


    def main():
        spark = session("solar-bronze")
        spark.sql(f"CREATE NAMESPACE IF NOT EXISTS {SCHEMA}")
        for stream in STREAMS:
            spark.sql(f"""
                CREATE TABLE IF NOT EXISTS {SCHEMA}.{stream}_raw (
                    value STRING COMMENT 'Kafka message as received (one JSON reading)',
                    kafka_topic STRING, kafka_partition INT, kafka_offset BIGINT,
                    kafka_timestamp TIMESTAMP,
                    ingested_at TIMESTAMP COMMENT 'When this job wrote the row')
                USING iceberg PARTITIONED BY (days(kafka_timestamp))
                COMMENT 'Solar demo bronze: raw {stream} readings from Kafka topic solar-{stream}, synthetic data'
            """)

        for stream in STREAMS:
            (
                spark.readStream.format("kafka")
                .option("kafka.bootstrap.servers", os.environ["KAFKA"])
                .option("kafka.security.protocol", "SSL")
                .option("kafka.ssl.truststore.type", "PEM")
                .option("kafka.ssl.truststore.location", f"{KAFKA_TLS}/ca.crt")
                .option("subscribe", f"solar-{stream}")
                .option("startingOffsets", "earliest")
                .option("maxOffsetsPerTrigger", 500000)
                # Kafka keeps the solar topics only for hours (configure-solar-topics.yaml). After a
                # longer outage, skip what expired instead of failing on every restart.
                .option("failOnDataLoss", "false")
                .load()
                .select(col("value").cast("string").alias("value"),
                        col("topic").alias("kafka_topic"), col("partition").alias("kafka_partition"),
                        col("offset").alias("kafka_offset"), col("timestamp").alias("kafka_timestamp"),
                        current_timestamp().alias("ingested_at"))
                .writeStream.format("iceberg")
                .outputMode("append")
                .trigger(processingTime="1 minute")
                .option("checkpointLocation", f"{CHECKPOINTS}/{stream}")
                # A micro-batch can span midnight; write to several day partitions without sorting.
                .option("fanout-enabled", "true")
                .queryName(f"bronze-{stream}")
                .toTable(f"{SCHEMA}.{stream}_raw")
            )
        spark.streams.awaitAnyTermination()


    if __name__ == "__main__":
        run("solar_bronze", main)
