---
# Bronze layer of the solar ingestion demo: a Spark Structured Streaming job that copies the
# measurement topics from Kafka into Iceberg tables in data2day.solar_bronze, unchanged.
#
#   solar-inverter -> solar_bronze.inverter_raw
#   solar-weather  -> solar_bronze.weather_raw
#   solar-clouds   -> solar_bronze.clouds_raw
#
# One row per Kafka message: the message as received (`value`), its Kafka coordinates and the
# ingest time. Append-only, partitioned by day of the Kafka timestamp; parsing and cleaning
# happen in silver. The master data topics (solar-sites, solar-weather_stations) are read by
# the dimension job instead.
#
# Spark 3.5.8 (SDP 26.3 LTS): there is no Iceberg Spark runtime for Spark 4.1 yet.
# Catalog access like Trino's data2day catalog: Lakekeeper REST with the lakekeeper-service
# client credentials, data files in Garage S3 through s3a with the Garage keys (not Iceberg's
# S3FileIO, whose remote signing via Lakekeeper fails). Checkpoints go to the same bucket.
apiVersion: v1
kind: ConfigMap
metadata:
  name: solar-bronze-job
  namespace: platform
data:
  bronze.py: |
    import os
    import traceback

    from pyspark.sql import SparkSession
    from pyspark.sql.functions import col, current_timestamp

    CATALOG = "data2day"
    SCHEMA = f"{CATALOG}.solar_bronze"
    STREAMS = ["inverter", "weather", "clouds"]
    CHECKPOINTS = "s3a://iceberg-warehouse/checkpoints/solar-bronze"
    S3_ENDPOINT = "http://garage.shared.svc.cluster.local:3900"
    KAFKA_TLS = "/stackable/kafka-tls"

    def main():
        spark = (
            SparkSession.builder.appName("solar-bronze")
            .config(f"spark.sql.catalog.{CATALOG}", "org.apache.iceberg.spark.SparkCatalog")
            .config(f"spark.sql.catalog.{CATALOG}.type", "rest")
            .config(f"spark.sql.catalog.{CATALOG}.uri", "http://lakekeeper:8181/catalog")
            .config(f"spark.sql.catalog.{CATALOG}.warehouse", "data2day")
            .config(f"spark.sql.catalog.{CATALOG}.credential", os.environ["LAKEKEEPER_CREDENTIAL"])
            .config(f"spark.sql.catalog.{CATALOG}.oauth2-server-uri", os.environ["KEYCLOAK_TOKEN_URL"])
            .config(f"spark.sql.catalog.{CATALOG}.scope", "openid")
            # Keycloak doesn't allow the token exchange Iceberg uses to refresh (same as Trino).
            .config(f"spark.sql.catalog.{CATALOG}.token-refresh-enabled", "false")
            # Data files through Hadoop's s3a with the Garage keys. Iceberg's own S3FileIO would
            # have Lakekeeper sign every request (no STS here), and that signing call fails (404).
            .config(f"spark.sql.catalog.{CATALOG}.io-impl", "org.apache.iceberg.hadoop.HadoopFileIO")
            .getOrCreate()
        )
        # s3a for the checkpoints and, via HadoopFileIO, the Iceberg files (table locations are
        # s3://...). HadoopFileIO ships this configuration to the executors.
        hadoop = spark.sparkContext._jsc.hadoopConfiguration()
        for key, value in {
            "fs.s3.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem",
            "fs.s3a.endpoint": S3_ENDPOINT,
            "fs.s3a.path.style.access": "true",
            "fs.s3a.endpoint.region": "garage",
            "fs.s3a.access.key": os.environ["S3_ACCESS_KEY"],
            "fs.s3a.secret.key": os.environ["S3_SECRET_KEY"],
        }.items():
            hadoop.set(key, value)

        spark.sql(f"CREATE NAMESPACE IF NOT EXISTS {SCHEMA}")
        for stream in STREAMS:
            spark.sql(f"""
                CREATE TABLE IF NOT EXISTS {SCHEMA}.{stream}_raw (
                    value STRING COMMENT 'Kafka message as received (one JSON reading)',
                    kafka_topic STRING,
                    kafka_partition INT,
                    kafka_offset BIGINT,
                    kafka_timestamp TIMESTAMP,
                    ingested_at TIMESTAMP COMMENT 'When this job wrote the row'
                )
                USING iceberg
                PARTITIONED BY (days(kafka_timestamp))
                COMMENT 'Solar demo bronze: raw {stream} readings from Kafka topic solar-{stream}, synthetic data'
            """)

        for stream in STREAMS:
            (
                spark.readStream.format("kafka")
                .option("kafka.bootstrap.servers", os.environ["KAFKA"])
                .option("kafka.security.protocol", "SSL")
                .option("kafka.ssl.truststore.type", "PEM")
                .option("kafka.ssl.truststore.location", f"{KAFKA_TLS}/ca.crt")
                .option("subscribe", f"solar-{stream}")
                .option("startingOffsets", "earliest")
                .option("maxOffsetsPerTrigger", 500000)
                .load()
                .select(
                    col("value").cast("string").alias("value"),
                    col("topic").alias("kafka_topic"),
                    col("partition").alias("kafka_partition"),
                    col("offset").alias("kafka_offset"),
                    col("timestamp").alias("kafka_timestamp"),
                    current_timestamp().alias("ingested_at"),
                )
                .writeStream.format("iceberg")
                .outputMode("append")
                .trigger(processingTime="1 minute")
                .option("checkpointLocation", f"{CHECKPOINTS}/{stream}")
                # A micro-batch can span midnight; write to several day partitions without sorting.
                .option("fanout-enabled", "true")
                .queryName(f"bronze-{stream}")
                .toTable(f"{SCHEMA}.{stream}_raw")
            )

        spark.streams.awaitAnyTermination()


    if __name__ == "__main__":
        try:
            main()
        except Exception:
            # Python tracebacks go to stderr, which the Vector agent doesn't collect; log through
            # log4j so the error ends up in OpenSearch with the rest of the driver log.
            active = SparkSession.getActiveSession()
            if active is not None:
                active.sparkContext._jvm.org.apache.logging.log4j.LogManager.getLogger(
                    "solar_bronze").error(traceback.format_exc())
            raise

---
apiVersion: spark.stackable.tech/v1alpha1
kind: SparkApplication
metadata:
  # A finished SparkApplication is not resubmitted when its spec changes: bump the suffix to
  # run a new version (ArgoCD prunes the old one).
  name: solar-bronze-v6
  namespace: platform
spec:
  vectorAggregatorConfigMapName: vector-aggregator-discovery
  # Event log for the Spark History Server (platform/manifests/spark-history/)
  logFileDirectory:
    s3:
      prefix: eventlogs/
      bucket:
        reference: spark-logs
  sparkImage:
    productVersion: 3.5.8
  mode: cluster
  mainApplicationFile: local:///stackable/spark/jobs/bronze.py
  sparkConf:
    # The operator's region setting for the event log bucket is ignored by Hadoop 3.4
    # (see platform/manifests/spark-history/spark-history.yaml).
    spark.hadoop.fs.s3a.bucket.spark-logs.endpoint.region: garage
  deps:
    packages:
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.12.0
      - org.apache.iceberg:iceberg-aws-bundle:1.12.0
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.8
  env:
    - name: KAFKA
      valueFrom:
        configMapKeyRef:
          name: kafka
          key: KAFKA
    - name: LAKEKEEPER_CREDENTIAL
      valueFrom:
        secretKeyRef:
          name: lakekeeper-service-credentials
          key: credential
    - name: KEYCLOAK_TOKEN_URL
      value: http://keycloak-service.platform.svc.cluster.local:8080/realms/stackable-demo/protocol/openid-connect/token
    - name: S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: garagefs-lakekeeper-credentials
          key: accessKeyId
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: garagefs-lakekeeper-credentials
          key: secretAccessKey
  volumes:
    - name: job
      configMap:
        name: solar-bronze-job
    - name: kafka-tls
      ephemeral:
        volumeClaimTemplate:
          metadata:
            annotations:
              secrets.stackable.tech/class: tls
              secrets.stackable.tech/format: tls-pem
              secrets.stackable.tech/scope: pod
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: "1"
            storageClassName: secrets.stackable.tech
            volumeMode: Filesystem
  job:
    config:
      volumeMounts:
        - name: job
          mountPath: /stackable/spark/jobs
  driver:
    config:
      logging:
        enableVectorAgent: true
      resources:
        cpu:
          min: 500m
          max: "1"
        memory:
          limit: 2Gi
      volumeMounts:
        - name: job
          mountPath: /stackable/spark/jobs
        - name: kafka-tls
          mountPath: /stackable/kafka-tls
  executor:
    replicas: 1
    config:
      logging:
        enableVectorAgent: true
      resources:
        cpu:
          min: 500m
          max: "1"
        memory:
          limit: 2Gi
      volumeMounts:
        - name: kafka-tls
          mountPath: /stackable/kafka-tls
