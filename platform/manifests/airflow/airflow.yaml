---
apiVersion: airflow.stackable.tech/v1alpha1
kind: AirflowCluster
metadata:
  name: airflow
  namespace: platform
spec:
  clusterOperation:
    stopped: false
  image:
    custom: oci.stackable.tech/sandbox/airflow:3.1.6-stackable0.0.0-dev-cosmos
    productVersion: 3.1.6
    pullPolicy: IfNotPresent
  clusterConfig:
    loadExamples: false
    exposeConfig: false
    credentialsSecret: airflow-credentials
    # NOTE: This cannot be parameterized via stackablectl since it is synced via ArgoCD.
    #
    # In terms of forking the repository, this should not be a problem since the DAGs are the same.
    # You can still change this locally and point to the fork in case of any changes to DAGs.
    #
    # TODO(@maltesander): In a Stackable release, this branch should point to the release-YY.MM branch!
    dagsGitSync:
      - repo: http://forgejo-http.deployment.svc.cluster.local:3000/stackable/openmetadata-dbt-demo.git
        branch: main
        gitFolder: "dags"
        depth: 2
    vectorAggregatorConfigMapName: vector-aggregator-discovery
    authentication:
      - authenticationClass: airflow-keycloak
        oidc:
          clientCredentialsSecret: airflow-keycloak-client
        userRegistrationRole: Public
        syncRolesAt: Registration
  webservers:
    roleConfig:
      listenerClass: external-stable
    envOverrides: &envOverrides
      AIRFLOW_CONN_KUBERNETES_IN_CLUSTER: "kubernetes://?__extra__=%7B%22extra__kubernetes__in_cluster%22%3A+true%2C+%22extra__kubernetes__kube_config%22%3A+%22%22%2C+%22extra__kubernetes__kube_config_path%22%3A+%22%22%2C+%22extra__kubernetes__namespace%22%3A+%22%22%7D"
      AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://airflow-logs/
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: garagefs
      # 20 seconds to reload the DAGS folder (default: 300)
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "20"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AUTH_ROLES_MAPPING: '{"admin": ["Admin"], "viewer": ["Viewer"]}'
    podOverrides: &podOverrides
      spec:
        containers:
          - name: airflow
            env:
              - name: AIRFLOW_CONN_GARAGEFS
                valueFrom:
                  secretKeyRef:
                    name: garagefs-airflow-credentials
                    key: airflow-connection
              # Trino credentials for the dbt DAG. Single source of truth is the
              # trino-users static-auth Secret; TRINO_PASSWORD must precede the
              # CONN var so Kubernetes can expand $(TRINO_PASSWORD) in its value.
              - name: TRINO_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: trino-users
                    key: admin
              - name: AIRFLOW_CONN_TRINO_DEFAULT
                value: "trino://admin:$(TRINO_PASSWORD)@trino-coordinator.platform.svc.cluster.local:8443/?protocol=https&verify=false"
    config:
      logging:
        enableVectorAgent: true
      gracefulShutdownTimeout: 30s
      resources:
        cpu:
          min: 400m
          max: "1"
        memory:
          limit: 2Gi
    roleGroups:
      default:
        replicas: 1
  kubernetesExecutors:
    config:
      logging:
        enableVectorAgent: true
    envOverrides: *envOverrides
    podOverrides:
      spec:
        containers:
          - name: base
            env:
              - name: AIRFLOW_CONN_GARAGEFS
                valueFrom:
                  secretKeyRef:
                    name: garagefs-airflow-credentials
                    key: airflow-connection
              - name: DBT_TARGET_PATH
                value: /tmp/dbt-target
              # Trino credentials for the dbt tasks + the wait_for_services sensor,
              # which both run in this executor pod. TRINO_PASSWORD (from trino-users)
              # feeds dbt's profiles.yml via env_var() and is expanded into the
              # Airflow connection URI below. Order matters for $(TRINO_PASSWORD).
              - name: TRINO_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: trino-users
                    key: admin
              - name: AIRFLOW_CONN_TRINO_DEFAULT
                value: "trino://admin:$(TRINO_PASSWORD)@trino-coordinator.platform.svc.cluster.local:8443/?protocol=https&verify=false"
  schedulers:
    envOverrides: *envOverrides
    podOverrides: *podOverrides
    config:
      logging:
        enableVectorAgent: true
      gracefulShutdownTimeout: 30s
      resources:
        cpu:
          min: 400m
          max: "1"
        memory:
          limit: 1Gi
    roleGroups:
      default:
        replicas: 1
  triggerers:
    envOverrides: *envOverrides
    podOverrides: *podOverrides
    config:
      logging:
        enableVectorAgent: true
      gracefulShutdownTimeout: 30s
      resources:
        cpu:
          min: 400m
          max: "1"
        memory:
          limit: 1Gi
    roleGroups:
      default:
        replicas: 1
