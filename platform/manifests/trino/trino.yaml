---
apiVersion: trino.stackable.tech/v1alpha1
kind: TrinoCluster
metadata:
  name: trino
  namespace: platform
spec:
  clusterOperation:
    stopped: false
  image:
    # 479 (not the 477 LTS): from 478 on, the OPA plugin sends the query ID with every
    # authorization request (input.context.queryId), so OPA decision logs can be grouped by query.
    productVersion: "479"
  clusterConfig:
    catalogLabelSelector:
      matchLabels:
        trino: trino
    vectorAggregatorConfigMapName: vector-aggregator-discovery
    authentication:
      - authenticationClass: trino-keycloak
        oidc:
          clientCredentialsSecret: trino-keycloak-client
      - authenticationClass: trino-users
    # Authorization via Open Policy Agent. The trino-operator auto-configures all
    # OPA policy URIs (allow/batch/column-masking/batch-column-masking/row-filters)
    # from this block. Policies live in the `trino` rego package served by the
    # `opa` OpaCluster (see platform/manifests/opa/).
    authorization:
      opa:
        configMapName: opa
        package: trino
  coordinators:
    roleConfig:
      listenerClass: external-unstable
    config:
      logging:
        enableVectorAgent: true
    podOverrides: &vectorPodOverrides
      spec:
        containers:
          - name: vector
            resources:
              requests:
                memory: 128Mi
              limits:
                memory: 512Mi
    roleGroups:
      default:
        replicas: 1
  workers:
    config:
      # Default is ~1h (graceful query draining). On a fresh deploy a worker that
      # never started (e.g. a Secret it mounts didn't exist yet) and then got
      # replaced sat in Terminating for that hour, so Trino had no worker,
      # trino-init failed and the dbt DAG waited. The demo has no long-running
      # queries to drain.
      gracefulShutdownTimeout: 1m
      logging:
        enableVectorAgent: true
    podOverrides: *vectorPodOverrides
    roleGroups:
      default:
        replicas: 1