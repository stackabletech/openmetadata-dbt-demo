---
# Read access to the solar demo's Kafka topics (schema `default`, one table per topic, e.g.
# `kafka."default"."solar-inverter"`). The table descriptions (kafka-table-descriptions.yaml)
# define the tables and decode the JSON records into typed columns; the connector's internal
# columns stay visible next to them: the raw record `_message`, `_key`, `_timestamp`,
# `_partition_id`, `_partition_offset`. Filter on `_timestamp`, which is pushed down to Kafka:
# solar-inverter holds tens of millions of records within its retention.
# Read-only for everyone (rego-trino-policies.yaml); the data is synthetic.
apiVersion: trino.stackable.tech/v1alpha1
kind: TrinoCatalog
metadata:
  name: kafka
  namespace: platform
  labels:
    trino: trino
spec:
  connector:
    generic:
      connectorName: kafka
      properties:
        kafka.nodes:
          valueFromConfigMap:
            name: kafka
            key: KAFKA
        kafka.default-schema:
          value: default
        # Mounted from the ConfigMap trino-kafka-tables into coordinator and workers (trino.yaml)
        kafka.table-description-dir:
          value: /stackable/kafka-tables
        # Keep `_message`, `_timestamp` etc. next to the decoded columns.
        kafka.hide-internal-columns:
          value: "false"
        # Kafka's certificate is issued by the secret-operator CA of SecretClass `tls`, which is
        # what Trino's internal truststore holds (see catalog-opensearch.yaml). It covers the
        # bootstrap service and the broker's advertised listener address.
        kafka.security-protocol:
          value: SSL
        kafka.ssl.truststore.location:
          value: /stackable/internal_tls/truststore.p12
        kafka.ssl.truststore.type:
          value: PKCS12
        kafka.ssl.truststore.password:
          value: changeit
