---
# Read access to the solar demo's Kafka topics (schema `default`, one table per topic, e.g.
# `kafka."default"."solar-inverter"`). There are no table descriptions yet, so a table has only
# the connector's internal columns: the record is the JSON string `_message`, plus `_key`,
# `_timestamp`, `_partition_id`, `_partition_offset`. Parse with json_extract_scalar() and
# filter on `_timestamp`, which is pushed down to Kafka: solar-inverter holds tens of millions
# of records within its retention.
# Read-only for everyone (rego-trino-policies.yaml); the data is synthetic.
apiVersion: trino.stackable.tech/v1alpha1
kind: TrinoCatalog
metadata:
  name: kafka
  namespace: platform
  labels:
    trino: trino
spec:
  connector:
    generic:
      connectorName: kafka
      properties:
        kafka.nodes:
          valueFromConfigMap:
            name: kafka
            key: KAFKA
        kafka.default-schema:
          value: default
        kafka.table-names:
          value: solar-inverter,solar-weather,solar-clouds,solar-sites,solar-weather_stations,solar-landkreise
        # Without a table description only the internal columns exist; don't hide them.
        kafka.hide-internal-columns:
          value: "false"
        # Kafka's certificate is issued by the secret-operator CA of SecretClass `tls`, which is
        # what Trino's internal truststore holds (see catalog-opensearch.yaml). It covers the
        # bootstrap service and the broker's advertised listener address.
        kafka.security-protocol:
          value: SSL
        kafka.ssl.truststore.location:
          value: /stackable/internal_tls/truststore.p12
        kafka.ssl.truststore.type:
          value: PKCS12
        kafka.ssl.truststore.password:
          value: changeit
