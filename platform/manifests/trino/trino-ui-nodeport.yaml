---
# Fixed port for the Trino web UI. The coordinator's listener Service (`trino-coordinator`) gets a
# random NodePort per deploy; links to a query (https://<node-ip>:30443/ui/query.html?<query id>,
# e.g. from the Grafana dashboard "Trino queries") need a stable one, like the other demo UIs.
apiVersion: v1
kind: Service
metadata:
  name: trino-ui-nodeport
  namespace: platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: trino
    app.kubernetes.io/instance: trino
    app.kubernetes.io/component: coordinator
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30443
      protocol: TCP
