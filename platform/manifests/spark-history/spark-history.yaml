---
# Spark History Server: the Spark UI for finished and running SparkApplications (bronze
# streaming, silver and gold batch jobs). Every SparkApplication writes its event log to
# s3://spark-logs/eventlogs/ (`logFileDirectory` with bucket reference spark-logs).
#
# Bucket, key and the Secret spark-s3-credentials are created by the GarageFS init Job.
#
# The History Server has no authentication of its own. It listens on localhost only
# (SPARK_LOCAL_IP) and an oauth2-proxy sidecar in front of it logs users in through Keycloak
# (client spark-history, configure-spark-history-oidc.yaml), like the demo landing page.
# UI: http://<node-ip>:30188/ (Service spark-history-ui).
apiVersion: secrets.stackable.tech/v1alpha1
kind: SecretClass
metadata:
  name: spark-s3-credentials
spec:
  backend:
    k8sSearch:
      searchNamespace:
        pod: {}
---
apiVersion: s3.stackable.tech/v1alpha1
kind: S3Connection
metadata:
  name: garage
  namespace: platform
spec:
  host: garage.shared.svc.cluster.local
  port: 3900
  accessStyle: Path
  region:
    name: garage
  credentials:
    secretClass: spark-s3-credentials
---
apiVersion: s3.stackable.tech/v1alpha1
kind: S3Bucket
metadata:
  name: spark-logs
  namespace: platform
spec:
  bucketName: spark-logs
  connection:
    reference: garage
---
apiVersion: spark.stackable.tech/v1alpha1
kind: SparkHistoryServer
metadata:
  name: spark-history
  namespace: platform
spec:
  image:
    productVersion: 3.5.8
  vectorAggregatorConfigMapName: vector-aggregator-discovery
  logFileDirectory:
    s3:
      prefix: eventlogs/
      bucket:
        reference: spark-logs
  nodes:
    roleConfig:
      # The operator's Service points at port 18080, which only listens on localhost.
      listenerClass: cluster-internal
    envOverrides:
      SPARK_LOCAL_IP: 127.0.0.1
    podOverrides:
      spec:
        containers:
          - name: oauth2-proxy
            image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1 # renovate: datasource=docker depName=oauth2-proxy/oauth2-proxy
            args:
              - --provider=keycloak-oidc
              - --upstream=http://127.0.0.1:18080/
              - --http-address=0.0.0.0:4180
              - --email-domain=*
              - --skip-provider-button=true
              - --scope=openid profile email roles
              - --cookie-secure=false
              # Cookies are not separated by port; don't clash with the landing page's.
              - --cookie-name=_spark_history_oauth2
              - --redirect-url=http://$(NODE_IP):30188/oauth2/callback
              - --oidc-issuer-url=$(OIDC_ISSUER_URL)
              - --client-id=spark-history
              - --client-secret=spark-history-secret
              - --cookie-secret=$(COOKIE_SECRET)
              - --whitelist-domain=$(KEYCLOAK_HOST)
            env:
              - name: NODE_IP
                valueFrom:
                  configMapKeyRef: { name: oidc-endpoints, key: node-ip }
              - name: OIDC_ISSUER_URL
                valueFrom:
                  configMapKeyRef: { name: oidc-endpoints, key: issuer-url }
              - name: KEYCLOAK_HOST
                valueFrom:
                  configMapKeyRef: { name: oidc-endpoints, key: keycloak-host }
              - name: COOKIE_SECRET
                valueFrom:
                  secretKeyRef: { name: spark-history-oauth2-proxy, key: cookie-secret }
            ports:
              - name: oauth2-proxy
                containerPort: 4180
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    config:
      cleaner: true
      logging:
        enableVectorAgent: true
    roleGroups:
      default:
        replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-ui
  namespace: platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: spark-history
    app.kubernetes.io/component: node
  ports:
    - name: http
      port: 4180
      targetPort: 4180
      nodePort: 30188
      protocol: TCP
