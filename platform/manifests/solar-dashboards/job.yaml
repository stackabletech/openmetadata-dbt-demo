---
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-solar-dashboards-v5
  namespace: platform
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: python:3.12-slim # renovate: datasource=docker depName=python
          command: ["python", "-u", "/scripts/configure_superset.py"]
          env:
            - name: SUPERSET_USER
              valueFrom:
                secretKeyRef: { name: simple-superset-credentials, key: adminUser.username }
            - name: SUPERSET_PASSWORD
              valueFrom:
                secretKeyRef: { name: simple-superset-credentials, key: adminUser.password }
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef: { name: trino-users, key: superset }
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: tls
              mountPath: /stackable/tls
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: configure-solar-dashboards-script
        # Only for ca.crt, to check Superset's certificate
        - name: tls
          ephemeral:
            volumeClaimTemplate:
              metadata:
                annotations:
                  secrets.stackable.tech/class: tls
                  secrets.stackable.tech/format: tls-pem
                  secrets.stackable.tech/scope: pod
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: "1"
                storageClassName: secrets.stackable.tech
                volumeMode: Filesystem
