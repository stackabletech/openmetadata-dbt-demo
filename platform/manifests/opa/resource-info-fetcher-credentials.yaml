# Placeholder for the OpenMetadata bot JWT the Resource Info Fetcher uses.
#
# Not a SealedSecret on purpose: the token only exists once OpenMetadata is up, so
# the configure-openmetadata Job (platform/manifests/openmetadata-init/) creates the
# bot `resource-info-fetcher` and patches its JWT into this Secret. The opa
# Application ignores `/data` here, so ArgoCD doesn't revert that.
#
# It has to exist from the start: the operator mounts it into every OPA pod, and
# without it the pods (and with them Trino's authorization) would not start. Until
# the Job has run, the fetcher gets 401 from OpenMetadata, and the policies fail
# closed (deny / mask) for tables in data2day.demo. The fetcher re-reads the
# token after a 401, so no restart is needed once the Job has patched it.
apiVersion: v1
kind: Secret
metadata:
  name: resource-info-fetcher-credentials
  namespace: platform
data:
  token: cGxhY2Vob2xkZXI= # "placeholder"
