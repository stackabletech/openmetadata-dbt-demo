---
apiVersion: opa.stackable.tech/v1alpha1
kind: OpaCluster
metadata:
  name: opa
  namespace: platform
spec:
  image:
    productVersion: 1.12.3
    # Pinned because the custom opa-operator build (infrastructure/opa-operator-custom.yaml)
    # reports version 0.0.0-dev and would otherwise pick the nightly OPA image.
    stackableVersion: 26.3.0
  clusterConfig:
    # User Info Fetcher sidecar: lets Rego resolve a user's Keycloak group
    # membership via data.stackable.opa.userinfo.v1.userInfoByUsername(...).
    # Our Keycloak is plain HTTP (keycloak-service:8080) and is NOT a Stackable
    # product, so it has no `tls` SecretClass cert — we therefore omit `tls`
    # entirely. Per the opa-operator CRD: "If not specified no TLS will be used"
    # and the port then defaults to HTTP semantics.
    userInfo:
      backend:
        keycloak:
          hostname: keycloak-service.platform.svc.cluster.local
          port: 8080
          clientCredentialsSecret: user-info-fetcher-client-credentials
          adminRealm: stackable-demo
          userRealm: stackable-demo
    # Resource Info Fetcher sidecar (custom opa-operator build, see
    # infrastructure/opa-operator-custom.yaml): lets Rego look up a table's
    # OpenMetadata tags and owners via data.stackable.opa.resourceinfo.v1.
    # Listens on 127.0.0.1:9477. The token is the JWT of the OpenMetadata bot
    # `resource-info-fetcher`, written into the Secret by configure-openmetadata.
    resourceInfo:
      backend:
        openMetadata:
          hostname: openmetadata.platform.svc.cluster.local
          port: 8585
          credentialsSecretName: resource-info-fetcher-credentials
      cache:
        # Short, so tag and owner changes in OpenMetadata show up quickly in the demo.
        entryTimeToLive: 10s
  servers:
    roleGroups:
      default:
        replicas: 1
