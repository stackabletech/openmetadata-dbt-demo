apiVersion: opensearch.stackable.tech/v1alpha1
kind: OpenSearchCluster
metadata:
  name: simple-opensearch
  namespace: platform
spec:
  image:
    productVersion: 3.4.0
  clusterOperation:
    stopped: false
  clusterConfig:
    security:
      # Apply the operator-managed settings below from the role group we have (the default,
      # `security-config`, would make the operator create an extra role group).
      managingRoleGroup: default
      settings:
        # config, internalUsers, roles and rolesMapping are managed by the operator, i.e. Git is
        # the source of truth and changes are hot-reloaded. The other settings only initialize the
        # security index.
        config:
          managedBy: operator
          content:
            value:
              _meta:
                type: config
                config_version: 2
              config:
                dynamic:
                  authc:
                    # Keycloak login for OpenSearch Dashboards (and bearer tokens in general).
                    # Tokens carry Keycloak realm roles (admin / viewer) in the `groups` claim,
                    # mapped to OpenSearch roles in roles_mapping.yml. The JWKS is fetched via the
                    # in-cluster Keycloak service; the issuer is not checked, because browser
                    # tokens are issued by the node-IP issuer, which is only known at runtime.
                    openid_auth_domain:
                      description: Authenticate via OpenID Connect (Keycloak)
                      http_enabled: true
                      transport_enabled: true
                      order: 0
                      http_authenticator:
                        type: openid
                        challenge: false
                        config:
                          subject_key: preferred_username
                          roles_key: groups
                          openid_connect_url: http://keycloak-service.platform.svc.cluster.local:8080/realms/stackable-demo/.well-known/openid-configuration
                      authentication_backend:
                        type: noop
                    basic_internal_auth_domain:
                      description: Authenticate via HTTP Basic against internal users database
                      http_enabled: true
                      transport_enabled: true
                      order: 1
                      http_authenticator:
                        type: basic
                        challenge: true
                      authentication_backend:
                        type: intern
                  authz: {}
        # Operator-managed as well, so that users and roles added here (e.g. `trino`,
        # `trino_reader`) reach running clusters.
        internalUsers:
          managedBy: operator
          content:
            valueFrom:
              secretKeyRef:
                name: initial-opensearch-security-config
                key: internal_users.yml
        roles:
          managedBy: operator
          content:
            valueFrom:
              secretKeyRef:
                name: initial-opensearch-security-config
                key: roles.yml
        rolesMapping:
          managedBy: operator
          content:
            valueFrom:
              secretKeyRef:
                name: initial-opensearch-security-config
                key: roles_mapping.yml
    vectorAggregatorConfigMapName: vector-aggregator-discovery
  nodes:
    roleConfig:
      discoveryServiceListenerClass: external-unstable
    config:
      logging:
        enableVectorAgent: true
      resources:
        cpu:
          min: 250m
    roleGroups:
      default:
        replicas: 1
    configOverrides:
      opensearch.yml:
        node.store.allow_mmap: "false"
        plugins.security.restapi.roles_enabled: all_access
    podOverrides:
      spec:
        containers:
          - name: vector
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
          - name: update-security-config
            resources:
              requests:
                cpu: 10m
