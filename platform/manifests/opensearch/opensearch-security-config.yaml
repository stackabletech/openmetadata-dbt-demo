---
apiVersion: v1
kind: Secret
metadata:
  name: initial-opensearch-security-config
  namespace: platform
stringData:
  internal_users.yml: |
    ---
    _meta:
      type: internalusers
      config_version: 2
    admin:
      hash: $2y$10$xRtHZFJ9QhG9GcYhRpAGpufCZYsk//nxsuel5URh0GWEBgmiI4Q/e
      reserved: true
      backend_roles:
      - admin
      description: OpenSearch admin user
    kibanaserver:
      hash: $2y$10$e9f1cnNdLPyYP7t4ADafa.BldfKs5quXQ2JHHId3SZD3RQ0tu1HYu
      reserved: true
      description: OpenSearch Dashboards user
    openmetadata:
      hash: $2y$10$m348da0AnaW/1Mn.6gSzU.52YovR7pHTWexjtjJvqT4gSqP3rpCji
      backend_roles:
      - openmetadata
      description: OpenMetadata search backend
    trino:
      hash: $2y$10$28JGXR0AqaV9gK2V.i7kNOu07E4526hHCykNWB664TovUWvVV12q2
      description: Trino catalog `opensearch` (read-only, role trino_reader)
    logs:
      hash: $2y$10$LnPJaCbfHJYASAkEhwFDzuEDAs3YngxuL7m243O7Wa7jaD6QiRqTy
      backend_roles:
      - logs
      description: Vector aggregator log writer
  roles.yml: |
    ---
    _meta:
      type: roles
      config_version: 2
    # Trino catalog `opensearch`: read all indices plus the metadata Trino's OpenSearch connector
    # needs to list indices and map them to tables (readall alone lacks the mapping and index APIs).
    trino_reader:
      cluster_permissions:
        - cluster_monitor
        - cluster_composite_ops_ro
      index_permissions:
        - index_patterns: ["*"]
          allowed_actions:
            - read
            - indices_monitor
            - "indices:admin/get"
            - "indices:admin/mappings/get"
            - "indices:admin/aliases/get"
            - "indices:admin/shards/search_shards"
    openmetadata_app:
      cluster_permissions:
        - cluster_monitor
        - cluster_composite_ops
        - "indices:admin/template/*"
      index_permissions:
        - index_patterns:
            - "*_search_index*"
            - "entity_report_data_index*"
            - "test_case_resolution_status_search_index*"
            - "test_case_result_search_index*"
          allowed_actions: ["indices_all"]
        # OpenMetadata lists the aliases of all indices (GET /*/_alias); without this, that call
        # fails with 403 every few minutes. Alias names only, no access to other indices' data.
        - index_patterns: ["*"]
          allowed_actions: ["indices:admin/aliases/get"]
    logs_writer:
      cluster_permissions:
        - cluster_monitor
        - cluster_composite_ops
      index_permissions:
        - index_patterns: ["logs-*"]
          allowed_actions:
            - "indices:data/write/bulk*"
            - "indices:data/write/index"
            - "indices:admin/create"
            - "indices:admin/mapping/put"
            - "indices:admin/mappings/fields/get"
  roles_mapping.yml: |
    ---
    _meta:
      type: rolesmapping
      config_version: 2
    all_access:
      reserved: false
      backend_roles:
      # The internal `admin` user and the Keycloak realm role `admin`
      - admin
    # Keycloak realm role `viewer` (demo-user): read everything in Dashboards
    kibana_user:
      reserved: false
      backend_roles:
      - viewer
    readall:
      reserved: false
      backend_roles:
      - viewer
    trino_reader:
      users:
      - trino
    kibana_server:
      reserved: true
      users:
      - kibanaserver
    openmetadata_app:
      backend_roles:
      - openmetadata
    logs_writer:
      backend_roles:
      - logs
