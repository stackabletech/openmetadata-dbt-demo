apiVersion: superset.stackable.tech/v1alpha1
kind: SupersetCluster
metadata:
  name: simple-superset
  namespace: platform
spec:
  image:
    productVersion: 6.0.0
  clusterConfig:
    # For Superset this lives under clusterConfig (spec.clusterOperation is not in its CRD and made
    # every sync of this Application fail)
    clusterOperation:
      stopped: false
    credentialsSecret: simple-superset-credentials
    vectorAggregatorConfigMapName: vector-aggregator-discovery
    authentication:
      - authenticationClass: superset-keycloak
        oidc:
          clientCredentialsSecret: superset-keycloak-client
        userRegistrationRole: Gamma
        syncRolesAt: Login
  nodes:
    roleConfig:
      listenerClass: external-unstable
    config:
      logging:
        enableVectorAgent: true
      resources:
        cpu:
          min: 100m
        memory:
          limit: 1Gi
    # HTTPS: the operator has no TLS setting for Superset, so gunicorn (started by the operator)
    # gets a certificate of the secret-operator SecretClass `tls` through GUNICORN_CMD_ARGS. The
    # certificate covers the Service name and the node address of the listener; browsers warn
    # about the demo CA like for Trino and NiFi. Certificates live 15 days at most, the
    # secret-operator restarts the pod before that.
    envOverrides:
      GUNICORN_CMD_ARGS: --certfile=/stackable/tls/tls.crt --keyfile=/stackable/tls/tls.key
    roleGroups:
      default:
        config:
          rowLimit: 10000
          webserverTimeout: 300
        configOverrides:
          superset_config.py:
            # "Solar Viewer" grants access to the solar demo's database connection (created by the
            # solar-dashboards Job); Trino decides per user what is readable (impersonation).
            AUTH_ROLES_MAPPING: '{"admin": ["Admin"], "viewer": ["Gamma", "Solar Viewer"]}'
            AUTH_ROLES_SYNC_AT_LOGIN: "true"
            # Base map for the deck.gl charts (solar demo) without a Mapbox key; the default CSP
            # already allows tile.openstreetmap.org. OSM tiles need visible attribution.
            DECKGL_BASE_MAP: "[['tile://https://tile.openstreetmap.org/{z}/{x}/{y}.png', 'Streets (OpenStreetMap)']]"
    podOverrides:
      spec:
        containers:
          - name: superset
            volumeMounts:
              - name: tls
                mountPath: /stackable/tls
            startupProbe:
              httpGet:
                scheme: HTTPS
            readinessProbe:
              httpGet:
                scheme: HTTPS
            livenessProbe:
              httpGet:
                scheme: HTTPS
          - name: vector
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
          - name: metrics
            resources:
              requests:
                cpu: 10m
        volumes:
          - name: tls
            ephemeral:
              volumeClaimTemplate:
                metadata:
                  annotations:
                    secrets.stackable.tech/class: tls
                    secrets.stackable.tech/format: tls-pem
                    secrets.stackable.tech/scope: service=simple-superset-node,listener-volume=listener
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: "1"
                  storageClassName: secrets.stackable.tech
                  volumeMode: Filesystem
