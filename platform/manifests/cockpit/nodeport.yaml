---
# External access to Cockpit, matching the demo's NodePort convention
# (30080 ArgoCD, 30585 OpenMetadata, 30900 Keycloak). HTTPS: the port leads to
# the TLS proxy in front of Cockpit (tls-proxy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: cockpit-nodeport
  namespace: platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cockpit-tls-proxy
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30300
      protocol: TCP
