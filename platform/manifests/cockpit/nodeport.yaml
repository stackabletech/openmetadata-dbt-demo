---
# External access to Cockpit, matching the demo's NodePort convention
# (30080 ArgoCD, 30088 landing, 30585 OpenMetadata, 30900 Keycloak).
apiVersion: v1
kind: Service
metadata:
  name: cockpit-nodeport
  namespace: platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cockpit
    app.kubernetes.io/instance: cockpit
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
      protocol: TCP
