---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opa
  namespace: deployment
  annotations:
    # Before Trino (sync-wave 1): the OpaCluster discovery ConfigMap and the
    # Rego bundles must exist before Trino reconciles its OPA authorization.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: dbt-openmetadata-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  source:
    repoURL: "http://forgejo-http.deployment.svc.cluster.local:3000/stackable/openmetadata-dbt-demo.git"
    targetRevision: "feat/data2day-lakekeeper"
    path: platform/manifests/opa/
  # configure-openmetadata patches the OpenMetadata bot JWT into this Secret;
  # don't revert it to the placeholder.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: resource-info-fetcher-credentials
      namespace: platform
      jsonPointers:
        - /data
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      selfHeal: true
      prune: true
    # The custom opa-operator creates the OpaCluster CRD itself once it runs. On a
    # fresh cluster this app can sync first and fail with "no matches for kind
    # OpaCluster"; automated sync doesn't retry the same commit on its own.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
