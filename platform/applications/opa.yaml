---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opa
  namespace: deployment
  annotations:
    # Before Trino (sync-wave 1): the OpaCluster discovery ConfigMap and the
    # Rego bundles must exist before Trino reconciles its OPA authorization.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: dbt-openmetadata-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  source:
    repoURL: "http://forgejo-http.deployment.svc.cluster.local:3000/stackable/openmetadata-dbt-demo.git"
    targetRevision: "feat/data2day"
    path: platform/manifests/opa/
  # configure-openmetadata patches the OpenMetadata bot JWT into this Secret;
  # don't revert it to the placeholder.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: resource-info-fetcher-credentials
      namespace: platform
      jsonPointers:
        - /data
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      selfHeal: true
      prune: true
