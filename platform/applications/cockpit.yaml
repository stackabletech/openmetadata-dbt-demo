---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cockpit
  namespace: deployment
spec:
  project: dbt-openmetadata-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  sources:
    # Stackable Cockpit v2 (experimental; no releases yet). We pin the Helm chart
    # to a specific commit on main (NOT a moving branch) and the image to a digest,
    # so a teardown + re-deploy is byte-for-byte reproducible.
    - repoURL: "https://github.com/stackabletech/cockpit"
      path: deploy/helm/cockpit
      targetRevision: c985c9ce5a248dc3784b5c6c5f7a7006d22d5a91
      helm:
        releaseName: cockpit
        valuesObject:
          image:
            # Custom demo build of cockpit branch demo/data2day-2 (local, /workspace/cockpit,
            # commit 3a7effc): main @ c985c9c (S3 storage browser, bookmarks, Trino
            # autocomplete) + PR #397 (fixes #371: with #330 alone every query ran as Trino
            # user `anonymous`). The chart (pinned above) is unchanged on that branch.
            # name:tag@digest — the digest pins the exact build.
            registry: oci.stackable.tech
            repository: sandbox/cockpit
            tag: "0.0.0-dev-data2day-3a7effc@sha256:0c09196492c584a63a3eeb2c458da11abf785aa1b0ee0271a0e0bad57ef1540f"
          sessionSecret:
            secretKeyRef:
              name: cockpit-secrets
              key: session-secret
          # Required since Cockpit stores sessions, users and storage connections in
          # PostgreSQL (postgresql-cockpit, platform/applications/postgres.yaml). No TLS on
          # the demo's PostgreSQL instances.
          database:
            host: postgresql-cockpit.shared.svc.cluster.local
            port: 5432
            name: cockpit
            user: cockpit
            password:
              secretKeyRef:
                name: cockpit-secrets
                key: database-password
            tls:
              mode: disable
          # S3 storage browser: users add their own connections (e.g. Garage,
          # http://garage.shared.svc.cluster.local:3900, region garage, path-style);
          # the key encrypts the credentials they save.
          features:
            storage:
              enabled: true
          storage:
            encryptionKey:
              secretKeyRef:
                name: cockpit-secrets
                key: storage-encryption-key
          # base-url / origin / oidc discoveryUrl are node-IP dependent and are
          # patched at runtime by the configure-cockpit Job from the oidc-endpoints
          # ConfigMap (see platform/manifests/cockpit/). The placeholders below are
          # what the chart renders into the `cockpit` ConfigMap before patching.
          origin: "http://localhost:3000"
          auth:
            baseUrl: "http://localhost:3000"
            oidc:
              enabled: true
              discoveryUrl: "http://localhost:3000"
              clientId: cockpit
              clientSecret:
                secretKeyRef:
                  name: cockpit-secrets
                  key: oidc-client-secret
          trino:
            # In-cluster coordinator; HTTPS with the Stackable `tls` SecretClass CA.
            # Use the per-rolegroup HEADLESS service name, not the `trino-coordinator`
            # role service: the Stackable-issued Trino cert only lists the headless
            # service + pod in its SANs. Cockpit verifies TLS (unlike dbt/OM/Airflow,
            # which set verify=false), so pointing at `trino-coordinator...` fails
            # ERR_TLS_CERT_ALTNAME_INVALID and the Trino view 500s.
            url: "https://trino-coordinator-default-headless.platform.svc.cluster.local:8443"
            userImpersonation:
              enabled: true
              userClaim: preferred_username
            auth:
              type: basic
              username: cockpit
              password:
                secretKeyRef:
                  name: cockpit-secrets
                  key: trino-auth-password
            tls:
              secretClass: tls
    # Our supporting manifests: NodePort + the configure-cockpit Job + its RBAC + SealedSecret.
    - repoURL: "http://forgejo-http.deployment.svc.cluster.local:3000/stackable/openmetadata-dbt-demo.git"
      targetRevision: "main"
      path: platform/manifests/cockpit/
  # The configure-cockpit Job rewrites these three keys with the real node IP.
  # Tell ArgoCD not to fight that patch (otherwise selfHeal reverts to localhost).
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: cockpit
      namespace: platform
      jsonPointers:
        - /data/base-url
        - /data/origin
        - /data/oidc-discovery-url
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
