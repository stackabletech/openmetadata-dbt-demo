---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: deployment
spec:
  project: dbt-openmetadata-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: shared
  source:
    repoURL: https://git.deuxfleurs.fr/Deuxfleurs/garage
    targetRevision: v1.3.1 # renovate: datasource=git-tags depName=https://git.deuxfleurs.fr/Deuxfleurs/garage
    path: script/helm/garage   # path to the chart within the repo
    helm:
      releaseName: garage
      valuesObject:
        # Data volumes: the chart default (100Mi, 1Gi on Azure disks) filled up with the solar
        # lakehouse and Spark event logs, and Garage lost blocks. 50Gi: all of Schleswig-Holstein
        # (~2,700 records/s) needs ~47 GB at steady state (silver 7 days, bronze 2 days), twice
        # with replicationFactor 2. Volume claim templates are immutable: on an existing cluster,
        # expand the PVCs and recreate the StatefulSet with --cascade=orphan.
        persistence:
          data:
            size: 50Gi
        garage:
          replicationFactor: 2
          rpcSecret: "5799da09045e5b2ad62bdd658aac3f4c1311bd2c92af32a4e8825ec810920063"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true