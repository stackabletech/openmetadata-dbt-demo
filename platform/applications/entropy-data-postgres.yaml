---
# Entropy Data needs the pgvector extension, which the Bitnami PostgreSQL image of the
# postgres ApplicationSet does not ship. Hence a small dedicated StatefulSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: entropy-data-postgres
  namespace: deployment
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: dbt-openmetadata-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: shared
  source:
    repoURL: "http://forgejo-http.deployment.svc.cluster.local:3000/stackable/openmetadata-dbt-demo.git"
    targetRevision: "feat/entropy"
    path: platform/manifests/entropy-data-postgres/
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
