---
stacks:
  forgejo:
    description: Stack with Forgejo repository that configures mirroring of repo
    stackableRelease: dev # This does not matter -> managed by ArgoCD
    stackableOperators: ["argo-deploys-operators"]
    labels:
      - forgejo
      - gitops
    manifests:
      ################################
      # bootstrap argo
      ################################
      - helmChart: https://raw.githubusercontent.com/stackabletech/openmetadata-dbt-demo/refs/heads/feat/entropy/infrastructure/argo-cd.yaml
      ################################
      # prerequisites
      ################################openmetadata-dbt-demo
      - plainYaml: https://raw.githubusercontent.com/stackabletech/openmetadata-dbt-demo/refs/heads/feat/entropy/infrastructure/sealed-secrets.yaml
      ################################
      # discover-node-ip — populates the oidc-endpoints ConfigMap in deployment + platform.
      # Applied here (not via ArgoCD) because Forgejo's pod blocks on this ConfigMap and
      # ArgoCD can't sync the keycloak-manifests until Forgejo serves the in-cluster mirror.
      ################################
      - plainYaml: https://raw.githubusercontent.com/stackabletech/openmetadata-dbt-demo/refs/heads/feat/entropy/infrastructure/discover-node-ip.yaml
      ################################
      # project - operators
      ################################
      - plainYaml: https://raw.githubusercontent.com/stackabletech/openmetadata-dbt-demo/refs/heads/feat/entropy/infrastructure/stackable-operators.yaml
      ################################
      # applicationset - operators
      ################################
      - plainYaml: https://raw.githubusercontent.com/stackabletech/openmetadata-dbt-demo/refs/heads/feat/entropy/infrastructure/stackable-operators-appset.yaml
      # opa-operator: custom build (resource-info-fetcher with OpenMetadata backend), not in the appset
      - plainYaml: https://raw.githubusercontent.com/stackabletech/openmetadata-dbt-demo/refs/heads/feat/entropy/infrastructure/opa-operator-custom.yaml
      ################################
      # applicationset - ForgeJo-installed and clones this repo, argo then looks at the in-cluster Forgejo, so that
      # users can push changes without breaking the demo
      ################################
      - plainYaml: https://raw.githubusercontent.com/stackabletech/openmetadata-dbt-demo/refs/heads/feat/entropy/infrastructure/forgejo.yaml
      ################################
      # applicationset - demo
      ################################
      - plainYaml: https://raw.githubusercontent.com/stackabletech/openmetadata-dbt-demo/refs/heads/feat/entropy/infrastructure/project.yaml
      - plainYaml: https://raw.githubusercontent.com/stackabletech/openmetadata-dbt-demo/refs/heads/feat/entropy/infrastructure/cluster-apps.yaml
      ################################
      # keycloak — IdP for OIDC across all demo tools
      ################################
      - plainYaml: https://raw.githubusercontent.com/stackabletech/openmetadata-dbt-demo/refs/heads/feat/entropy/infrastructure/keycloak-operator.yaml
      - plainYaml: https://raw.githubusercontent.com/stackabletech/openmetadata-dbt-demo/refs/heads/feat/entropy/infrastructure/keycloak.yaml
    supportedNamespaces: ["deployment"]
    resourceRequests:
      cpu: 1750m
      memory: 1714Mi
      pvc: 110Gi
    parameters:
      - name: forgejoAdminPassword
        description: Password of the Forgejo admin user
        default: stackable
      - name: forgejoAdminUser
        description: Username of the Forgejo admin user
        default: stackable
      - name: stackableReleaseVersion
        description: The Stackable release to be installed via Argo. This replaces the demo `stackableRelease` parameter.
        default: 26.3.0
      - name: argocdAdminPassword
        description: Password of the ArgoCD admin user.
        # generated via: `htpasswd -nbBC 10 "" adminadmin | tr -d ':\n'`
        default: $2y$10$HhJC3pGHTlk8RyBoS39N/.wC72mdWxV2X8QS1wROUwCFxl.2tGfky
      - name: repoRevision
        description: Target branch from repository to point ArgoCD at
        # Matches the branch this file is committed on (kept in sync by `just retarget`).
        # `just deploy <branch>` overrides it, but a bare `stackablectl` run uses this.
        default: feat/entropy
