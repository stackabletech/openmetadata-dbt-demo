---
releaseName: argocd
name: argo-cd
namespace: deployment
repo:
  name: argo-cd
  url: https://argoproj.github.io/argo-helm
version: 9.4.10 # v3.3.3
options:
  configs:
    secret:
      argocdServerAdminPassword: "{{ argocdAdminPassword }}"
      # We have to set the time otherwise error message:
      # invalid session: Account password has changed since token issued
      argocdServerAdminPasswordMtime: "2025-01-01T00:00:00Z"
    cm:
      # Disable the local admin/adminadmin login so the only login
      # affordance is "Sign in with Keycloak". Combined with the
      # demo-landing link pointing to /auth/login, users in the happy
      # path never see ArgoCD's login UI.
      admin.enabled: "false"
      # `url` (https://<node-ip>:30080) is not set here: it depends on the node IP,
      # and argocd-server does not resolve $<secret>:<key> references in `url`.
      # discover-node-ip patches it into argocd-cm during stackablectl bootstrap.
      #
      # $<secret>:<key> in oidc.config is resolved by argocd-server against the
      # named Secret (labelled app.kubernetes.io/part-of=argocd) in the same
      # namespace; it does not work with ConfigMaps. discover-node-ip writes the
      # Secret oidc-endpoints and then restarts argocd-server.
      oidc.config: |
        name: Keycloak
        issuer: $oidc-endpoints:issuer-url
        clientID: argocd
        clientSecret: argocd-secret
        requestedScopes:
          - openid
          - profile
          - email
          - roles
        requestedIDTokenClaims:
          realm_access:
            essential: true
    rbac:
      policy.default: ""
      policy.csv: |
        g, admin, role:admin
        g, viewer, role:readonly
  dex:
    enabled: false
  notifications:
    enabled: false