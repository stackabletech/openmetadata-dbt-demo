---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: deployment
spec:
  project: dbt-openmetadata-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  source:
    repoURL: "http://forgejo-http.deployment.svc.cluster.local:3000/stackable/openmetadata-dbt-demo.git"
    # Bootstrap app applied by stackablectl, which substitutes the repoRevision
    # stack parameter (same mechanism as cluster-apps.yaml). Must NOT be a
    # hardcoded branch, or a branch deploy silently gets main's keycloak-manifests.
    targetRevision: {{ repoRevision }}
    path: infrastructure/keycloak-manifests/
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
